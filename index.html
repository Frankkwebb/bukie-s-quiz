<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bukie: IP, Theme 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{
  --bg:#f6f7fa;--sf:#ffffff;--ink:#101935;--mut:#636d86;--line:#dfe3ec;--soft:#eceff5;
  --law:#2b50ff;--eth:#c13ee0;--con:#f0a000;
  --ok:#14804a;--okb:#e5f5ec;--no:#d23c3c;--nob:#fdeaea;--btn:#101935;--btnx:#ffffff;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--sf:#161a24;--ink:#e9ecf8;--mut:#98a0b5;--line:#272c3a;--soft:#1d2230;--law:#8095ff;--eth:#dd8cf2;--con:#ffc247;--ok:#4cd68a;--okb:#12301f;--no:#ff7a7a;--nob:#381a1c;--btn:#e9ecf8;--btnx:#0e1118;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0e1118;--sf:#161a24;--ink:#e9ecf8;--mut:#98a0b5;--line:#272c3a;--soft:#1d2230;--law:#8095ff;--eth:#dd8cf2;--con:#ffc247;--ok:#4cd68a;--okb:#12301f;--no:#ff7a7a;--nob:#381a1c;--btn:#e9ecf8;--btnx:#0e1118;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.shell{max-width:700px;margin:0 auto;padding:18px 20px 80px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
[data-s=pat]{--c:var(--law)}[data-s=cpy]{--c:var(--eth)}[data-s=mrk]{--c:var(--con)}[data-s=use]{--c:var(--teal)}

.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:30px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.dots{display:flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.top nav{display:flex;gap:6px}
.top nav button{padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:600}
.top nav button[aria-current=page]{color:var(--ink);background:var(--soft)}
.quiet{color:var(--mut);font-weight:600;padding:8px 0}
.count{color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}

.hero{font-weight:720;font-size:clamp(44px,11.5vw,86px);line-height:.96;letter-spacing:-.035em;margin:0 0 20px;text-wrap:balance}
.hero.sm{font-size:clamp(36px,8.5vw,56px);line-height:1.02}
.lede{color:var(--mut);font-size:19px;line-height:1.5;max-width:46ch;margin:0}
.start{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:32px 0 56px}
.seg{display:inline-flex;background:var(--soft);border-radius:13px;padding:4px;gap:2px}
.seg button{padding:10px 16px;border-radius:10px;font-weight:600;color:var(--mut);min-width:48px;text-align:center}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(16,25,53,.14)}
.cta{background:var(--btn);color:var(--btnx);border-radius:14px;padding:16px 28px;font-weight:650;font-size:18px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.ghost{border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:600;transition:border-color .12s}
.ghost:hover{border-color:var(--ink)}

h2.sec,.map h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.key{color:var(--mut);font-size:15px;margin:0 0 24px;max-width:56ch}
.grp{margin-bottom:26px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.subj{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.subj::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.mut{color:var(--mut);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
.tiles i{aspect-ratio:1;border-radius:4px;background:var(--c);opacity:.18}
.tiles i.r{opacity:1}.tiles i.w{background:var(--no);opacity:1}

.ribbon{display:flex;align-items:center;height:14px;margin-bottom:26px}
.ribbon i{flex:1;min-width:1px;height:5px;border-radius:3px;background:var(--c);opacity:.2;transition:opacity .2s,background .2s}
.ribbon i.on{opacity:1}.ribbon i.bad{background:var(--no)}.ribbon i.now{height:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mut);font-size:15px}
.meta .subj{color:var(--ink);font-size:16px}
.q{font-weight:620;font-size:clamp(23px,5vw,31px);line-height:1.22;letter-spacing:-.015em;margin:14px 0 26px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sf);line-height:1.4;transition:border-color .12s,background .12s,opacity .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no .k{background:var(--no);color:#fff}
.opt.dim{opacity:.5}
.ruling{margin-top:24px;border-left:3px solid var(--c);padding:2px 0 2px 18px;animation:rise .22s ease-out}
.ruling b{font-size:19px;font-weight:700}.ruling b.g{color:var(--ok)}.ruling b.r{color:var(--no)}
.ruling p,.why{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:19px;line-height:1.6;margin:6px 0 0;max-width:62ch}
.actions{position:sticky;bottom:0;margin-top:22px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

.prow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin:0 0 18px}
.prow .fr{font-variant-numeric:tabular-nums;color:var(--mut)}
.track{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:4px;animation:grow .6s ease-out}
@keyframes grow{from{width:0}}
.rows{margin-top:30px;max-width:520px}
.miss{border-top:1px solid var(--line);padding:22px 0}
.miss h3{font-size:21px;line-height:1.28;font-weight:600;letter-spacing:-.01em;margin:10px 0 12px}
.ans{margin:0 0 8px;color:var(--ok);font-weight:600}
.ans::before{content:"\2713\00a0"}
.why{margin:0}

.sum{font-size:clamp(22px,5vw,30px);line-height:1.25;font-weight:500;color:var(--mut);margin:0 0 26px}
.sum b{color:var(--ink);font-weight:720}
.trend{display:flex;gap:4px;height:84px;margin-bottom:34px}
.trend i{flex:1;max-width:28px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
.trend b{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.88;border-radius:5px 5px 0 0}
.sess{border-top:1px solid var(--line)}
.sess:last-of-type{border-bottom:1px solid var(--line)}
.sess summary{list-style:none;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:16px 0;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin-left:2px;transition:transform .15s}
.sess[open] summary::after{transform:rotate(-135deg)}
.when{flex:1 1 150px;font-weight:600}
.mix{display:flex;gap:5px}
.mb{display:block;width:34px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.mb i{display:block;height:100%;background:var(--c)}
.sc{font-variant-numeric:tabular-nums;color:var(--mut)}.sc b{color:var(--ink)}
.sbody{padding:0 0 12px}.sbody .ghost{margin-bottom:6px}
.danger{margin-top:40px;color:var(--no)}

@media (max-width:480px){.shell{padding:14px 16px 72px}.opt{padding:14px}.lede{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--teal:#0f9d8a}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--teal:#4fd1bd}}:root[data-theme="dark"]{--teal:#4fd1bd}
</style>
</head>
<body>
<div class="shell"><header class="top" id="top"></header><main id="app"></main></div>
<script>
(()=>{
const D=[{"s":"pat","t":"What IP is","pts":["IPRs protect intellectual creations and are national rights.","Registration needed: patents, trade marks, registered designs, domain names.","No registration: copyright, unregistered marks and designs, confidential information.","Run through a national patent office plus national courts."],"q":[["What IP is","Which of these needs registration?",["A patent","Copyright","Confidential information","Unregistered design right"],0,"Patents, trade marks, registered designs and domain names are registered; the rest arise automatically."],["What IP is","IP rights are:",["Global rights","National rights","EU-wide only","Rights of the state over citizens"],1,"Protection abroad needs rights in each country."],["What IP is","Irish IP is implemented through:",["A national patent office and national courts","The ECJ alone","Companies House","A single global register"],0,"The office grants rights; the courts enforce and test validity."],["What IP is","The first recorded English patent (1449) was granted for:",["Printing","Cloth dyeing","Stained glass manufacturing","Shipbuilding"],2,"King Henry VI granted it to John of Utynam, establishing a state-granted limited monopoly."]]},{"s":"pat","t":"Confidential information","pts":["No registration. It needs the quality of confidence and must not be public.","Used for unpatentable technical or commercial know-how (e.g. tolerances, operating procedures).","Sign an NDA before disclosing; breach is typically breach of contract."],"q":[["Confidential information","Confidential information needs:",["Registration at the Patent Office","A court order","The necessary quality of confidence, and not be public","A © mark"],2,"No registration is required, but the information must not be in the public domain."],["Confidential information","It is mainly used to protect:",["Domain names","Logos","Novels","Unpatentable know-how"],3,"E.g. manufacturing tolerances and detailed operating procedures."],["Confidential information","Before disclosing know-how in a technology transfer you should:",["Publish it first","Have a written agreement such as an NDA","File a trade mark","Disclose it verbally only"],1,"Once published, nobody will pay for it."],["Confidential information","Breach of a binding know-how agreement is typically:",["A criminal offence","Passing off","Copyright infringement","A breach of contract"],3,"Courts deal with it as a contract matter."]]},{"s":"pat","t":"Patents: the basics","pts":["A patent is a monopoly right in an invention, only in the country granted (Irish patent = Ireland).","Tests: novelty, inventive step, industrial applicability.","Novelty is absolute and worldwide: nothing published before filing. Confidential disclosure doesn't count."],"q":[["Patents: the basics","A patent is:",["An automatic right in an expression","A right in a business name","A right in an internet address","A monopoly right in an invention"],3,"It covers how things work and how they are made."],["Patents: the basics","An Irish patent restrains commercial activity:",["In the UK only","Only in Ireland","Across the EU","Worldwide"],1,"To restrain activity abroad you need a patent there."],["Patents: the basics","The novelty requirement is:",["Absolute: no publication anywhere before filing","Relaxed by a 12-month grace period","Limited to Ireland","Judged at grant"],0,"Disclosures at conferences are not exempt."],["Patents: the basics","A disclosure under a duty of confidentiality is:",["An infringement","Not a publication for novelty","A publication only at conferences","A publication"],1,"So confidential disclosure doesn't destroy novelty."],["Patents: the basics","Inventive step means the invention must not be:",["Described in a specification","Obvious to a skilled person given the state of the art","Expensive to make","Registered elsewhere"],1,"Hindsight is not applied."],["Patents: the basics","Industrial applicability mainly excludes:",["Tin-openers","Chemical processes","Software","'Impossible' inventions like perpetual motion machines"],3,"'Industry' includes agriculture."]]},{"s":"pat","t":"Exclusions and software","pts":["Excluded: discoveries, scientific theories, maths methods, aesthetic works, mental acts, games, business methods, computer programs 'as such', presentation of information, surgery/therapy methods, immoral inventions.","Software inventions can be patentable in Europe if technical, novel and inventive.","The EU directive was rejected by the European Parliament."],"q":[["Exclusions and software","Which is excluded from patentability?",["An electronic circuit","A scientific theory","A tin-opener","A new material-making process"],1,"Discoveries, theories and mathematical methods are excluded."],["Exclusions and software","Software-based inventions in Europe are:",["Only allowed for games","Patentable if not excluded 'as such' and novel and inventive","Always banned","Always allowed"],1,"The notes call 'software can't be patented' a misconception."],["Exclusions and software","Applications are more often rejected for:",["Being excluded subject matter","No © mark","Lacking novelty or inventive step","Wrong language"],2,"E.g. the diagonal cursor patent failed on inventive step."],["Exclusions and software","The proposed EU directive on computer-implemented inventions:",["Was vetoed by the Council","Became a Regulation","Was passed unchanged","Was rejected by the European Parliament"],3,"Treatment can still differ between EU countries."]]},{"s":"pat","t":"Getting a patent","pts":["Application = specification (illustrative) + claims (these limit protection).","Search, publication at 18 months, max term 20 years, 3-4 years to grant in Ireland.","Paris Convention: 12-month priority. EPC gives a bundle of national patents; PCT needs national prosecution.","US: first-to-invent, 12-month grace, business methods patentable (State Street)."],"q":[["Getting a patent","Which part of an application limits scope of protection?",["The abstract","The claims","The specification","The title"],1,"The specification is merely illustrative."],["Getting a patent","Maximum patent term:",["10 years","Life plus 70","25 years","20 years"],3,"An annual renewal fee keeps it in force."],["Getting a patent","For infringement, which published version matters?",["Neither","Either","The granted one (B)","The application (A)"],2,"A-publication claims may look broad but narrow during examination."],["Getting a patent","Paris Convention priority lets you file further applications within:",["12 months","18 months","6 months","24 months"],0,"They keep the first filing date for novelty."],["Getting a patent","Once granted, a European patent becomes:",["A single EU patent","A PCT patent","A bundle of national patents","A petty patent"],2,"It breaks down just as if filed in each country."],["Getting a patent","Outside the US, the patent goes to:",["The one with most claims","The first to file","The first to invent","The richest applicant"],1,"In the US it is first-to-invent (swearing back)."],["Getting a patent","In the US, a disclosure within what period before filing isn't counted against novelty?",["None","12 months","6 months","18 months"],1,"Elsewhere novelty is worldwide and strict."],["Getting a patent","State Street Bank v Signature Financial (1998) held that:",["Software is excluded","Designs are patentable","A business method was patentable","Patents last 14 years"],2,"US law excludes very little."]]},{"s":"cpy","t":"Copyright basics","pts":["Automatic: arises when an original work is fixed. No registration; © not required in Ireland.","Protects the expression, not the idea. Originality threshold is low.","No copyright in names, slogans or jingles (maybe trade marks)."],"q":[["Copyright basics","Copyright protects:",["Inventions","The expression of an idea","Names and slogans","The idea itself"],1,"Writing a story with the same 'twist' in different words is fine."],["Copyright basics","To get copyright in Ireland you must:",["Add a © mark","Register at the Patent Office","Publish the work","Nothing: it arises automatically on fixation"],3,"Keep dated, signed evidence of the original though."],["Copyright basics","The originality threshold is:",["Very high","Worldwide novelty","Relatively low: just not copied","Inventive step"],2,"Originality means not copied."],["Copyright basics","Is there copyright in a slogan like 'I'm luvin it'?",["Yes, for 70 years","No (may be a trade mark)","Yes, if registered","Only in the US"],1,"Names, slogans and jingles are excluded."],["Copyright basics","Which is a protected work?",["A computer program","A slogan","A mathematical method","A company name"],0,"Programs and preparatory materials are literary works."],["Copyright basics","The Statute of Anne (1709) was:",["A design law","A trade mark Act","A patent law","The first UK Act on copyright for books"],3,"It made the author the owner for a fixed term."]]},{"s":"cpy","t":"Rights and duration","pts":["A negative right: stops copying, issuing, performing, broadcasting, adapting or dealing in infringing copies.","Buying a copy gives title to the medium only.","Duration: life + 70 years; 25 years for industrially produced artistic works.","Moral rights: be identified, object to derogatory treatment, not be falsely credited."],"q":[["Rights and duration","Copyright is described as:",["A registered monopoly","A licence","A negative right","A positive right to use"],2,"It lets the owner prevent acts."],["Rights and duration","Buying a book or CD gives you:",["Full copyright","The right to adapt","Title to the medium only","The right to copy privately"],2,"No right to make further copies."],["Rights and duration","General copyright duration:",["50 years","Life of author plus 70 years","20 years","Life plus 25"],1,"Reciprocal outside Ireland/EU."],["Rights and duration","Industrially produced artistic works last:",["70 years","10 years","15 years","25 years"],3,"A shorter term than general copyright."],["Rights and duration","Which is a moral right?",["Right to broadcast","Right to object to derogatory treatment","Right to sell copies","Right to license"],1,"Also identification and no false attribution."],["Rights and duration","The right to be identified as author must be:",["Asserted","Automatic and unwaivable","Registered","Paid for"],0,"It can also be waived."],["Rights and duration","Moral rights do NOT apply:",["In novels","In poems","In paintings","In computer programs"],3,"Also employer-owned works, newspapers and reference works."]]},{"s":"cpy","t":"Software copyright","pts":["Owner can stop even temporary copying (running, loading, displaying).","Lawful acquirers may use for intended purpose, incl. error correction.","Non-literal copying can infringe (Richardson v Flanders). Navitaire v easyJet: command set and business logic not protected."],"q":[["Software copyright","For software, the owner can prevent:",["Nothing once sold","Even temporary copying to run the program","Only copying to disk","Only permanent copying"],1,"Also translation, adaptation and decompilation."],["Software copyright","Lawful acquirers may:",["Modify and publish it","Copy and resell it","Decompile freely","Use it for its intended purpose, including error correction"],3,"Unless agreed otherwise."],["Software copyright","Richardson v Flanders: a copy in a different language with a similar interface was:",["Held infringement","Not infringement","Fair use","A patent issue"],0,"Non-literal copying can infringe."],["Software copyright","Navitaire v easyJet: the command set and business logic were:",["Not protected by copyright","Protected by database right","Protected as literary works","Fully protected"],0,"Different code and architecture; source code never seen."],["Software copyright","Circulating a device to bypass technical protection is something the owner can:",["Only licence","Prevent","Only claim damages for","Not prevent"],1,"Devices include algorithms, software and hardware."]]},{"s":"cpy","t":"Database right","pts":["Copyright needs originality in selection/arrangement.","Sui generis right: substantial investment, no registration, 15 years (renewed on substantial update), stops extraction/re-utilisation of a substantial part.","BHB v William Hill: ECJ cost mostly creating data, so narrower protection."],"q":[["Database right","Copyright in a database requires:",["Registration","Originality in selection or arrangement","A © mark","Substantial investment"],1,"Many costly databases lack originality."],["Database right","Sui generis database right requires:",["Novelty","Substantial investment","Registration","Originality"],1,"It protects databases lacking originality."],["Database right","Database right lasts:",["Forever without update","15 years, restarting on substantial update","25 years","70 years"],1,"It is perpetual in nature if kept updated."],["Database right","Database right protects against:",["Any viewing","Extraction or re-utilisation of a substantial part","Reading it","Indexing only"],1,"Repeated systematic extraction of small parts can also count."],["Database right","In BHB v William Hill the £4m cost was mostly for:",["Marketing","Staff","Creating the data, not the database","Hosting"],2,"So it was not 'substantial investment' in the database."],["Database right","The ECJ decision in BHB v William Hill:",["Abolished database right","Expanded protection","Applied copyright instead","Appears to have reduced the scope of protection"],3,"William Hill took only insubstantial parts."]]},{"s":"mrk","t":"Trade marks","pts":["A badge of origin for goods or services. ® registered, TM unregistered.","Registered 10 years, renewable indefinitely, in specific classes; must be in use.","Not misleading or descriptive. EU trade mark is one right, one renewal fee.","Unregistered: passing off needs goodwill, misrepresentation, damage."],"q":[["Trade marks","A trade mark identifies:",["The origin of goods or services","The design","The author","The inventor"],0,"It acts as a badge of origin."],["Trade marks","Registered marks use ___ and unregistered use ___:",["® and TM","® and ©","TM and ®","© and ®"],0,"Registered marks show ®."],["Trade marks","A trade mark is first registered for:",["5 years","10 years, renewable indefinitely","25 years","20 years"],1,"It must be in constant, relevant use."],["Trade marks","Which cannot be a trade mark?",["A logo","A shape","A smell","A descriptive term such as 'apple' for groceries"],3,"Descriptive and laudatory terms are ineligible."],["Trade marks","Passing off requires:",["Registration, copying and loss","Goodwill, misrepresentation and likely damage","Novelty and inventive step","Originality and fixation"],1,"It protects reputation at common law."],["Trade marks","Trade marks have no:",["Class restrictions","Territory","Worldwide novelty requirement","Renewal"],2,"Different owners can hold BUDWEISER in different countries."],["Trade marks","A European trade mark is:",["A PCT filing","A bundle of national rights","Valid only in Ireland","A single right covering the EU with one renewal fee"],3,"Unlike European patents."]]},{"s":"mrk","t":"Domain names","pts":["Not strictly an IPR, just a leased internet address, first-come first-served.","Cybersquatting: registering marks or famous names you have no link with.","UDRP: quick, cheap, written; cancellation or transfer, no damages; abusive registrations only."],"q":[["Domain names","A domain name is:",["A registered design","Not strictly an IP right, just a leased address","A patent","A copyright work"],1,"It conflicts with IPR business identifiers."],["Domain names","Cybersquatting is:",["Registering your own mark","Copying a website","Hosting offshore","Registering marks or famous names you have no connection with"],3,"Often for sale at inflated prices."],["Domain names","UDRP remedies are limited to:",["Fines","Cancellation or transfer, no damages","Damages only","Injunction and damages"],1,"Only for abusive registrations involving a trade mark."],["Domain names","UDRP proceedings are:",["In the High Court","Oral only","Slow and costly","Quick (under 60 days), cheap and in writing"],3,"Provided by ICANN."],["Domain names","In Prince v Prince the UK company:",["Paid damages","Won its counter-suit for unjustified threats","Lost the domain","Transferred it"],1,"The US firm settled for princetennis.com."],["Domain names","In the .eu sunrise phases the first group was:",["Unregistered mark holders","The general public","Governments","Registered trade mark holders"],3,"Unregistered holders came second."]]},{"s":"mrk","t":"Designs","pts":["Registered design: monopoly in the appearance of a product (lines, contours, colours, shape, texture). 5 years, renewable to 25.","No need to prove copying. Needs freedom of design and 'individual character'; 12-month grace.","Unregistered design right: copying must be proven; shorter terms."],"q":[["Designs","A registered design protects:",["The appearance of the whole or part of a product","How it works","The idea","Its name"],0,"Including icons and typefaces."],["Designs","Registered design term:",["20 years","10 years renewable","70 years","5 years, renewable every 5 to a maximum of 25"],3,"It can be sold or licensed."],["Designs","Infringing a registered design requires proof of:",["Intent","Copying","Only that the articles look the same","Loss of sales"],2,"Unlike copyright."],["Designs","A design dictated purely by function is:",["Registrable","A patent","Not registrable","Registrable for 3 years"],2,"E.g. a brake pad that must fit the callipers."],["Designs","The designer's own disclosure is excused for:",["3 years","None","6 months","12 months before filing"],3,"Others' similar disclosures still count against novelty."],["Designs","Unregistered design right infringement requires:",["A similar look only","Intent to deceive","Registration","Proof of copying"],3,"Independent production isn't infringement."],["Designs","The second form of unregistered design right lasts:",["25 years","3 years from first EU marketing","15 years","10 years"],1,"It is based on registered design criteria."]]},{"s":"use","t":"Who owns IP","pts":["First owner is usually the creator.","Employee in course of employment: employer owns, no assignment needed.","Contractor keeps copyright unless the contract says otherwise.","Computer-generated work: the person making the arrangements."],"q":[["Who owns IP","The first owner of IP is usually:",["The first buyer","The state","Its author or creator","The employer always"],2,"Joint ownership is possible."],["Who owns IP","IP created in the course of employment belongs to:",["Both equally","The state","The employee","The employer, with no assignment needed"],3,"Directors owe a greater duty."],["Who owns IP","A cleaner's invention unrelated to their duties belongs to:",["The state","The cleaner","The employer","The company"],1,"Their duties wouldn't be expected to create IP."],["Who owns IP","A commissioned contractor normally keeps:",["Nothing","Only moral rights","The patent","The copyright unless the contract says otherwise"],3,"So get an explicit assignment."],["Who owns IP","The author of a computer-generated work is:",["Nobody","The user only","The computer","The person who made the arrangements for it"],3,"A statutory rule."]]},{"s":"use","t":"Assignment and licensing","pts":["Assignment = outright transfer. Licence = permission with an ongoing relationship.","Patent and copyright assignments must be in writing and signed; register Irish assignments within about 6 months.","Only the owner can license. Sole = owner may also act; exclusive = even owner excluded."],"q":[["Assignment and licensing","An assignment is:",["An outright transfer of rights","A renewal","A continuing permission","A court order"],0,"The assignor transfers to the assignee."],["Assignment and licensing","A copyright assignment in Ireland must be:",["Oral","In writing and signed by the assignor","Registered","Witnessed by a solicitor"],1,"Patent assignments too."],["Assignment and licensing","Irish assignments should be registered within about:",["3 years","30 days","12 months","6 months"],3,"Otherwise damages may be restricted."],["Assignment and licensing","Only who can grant a licence?",["Any user","The licensee","The owner (all co-owners agree)","The Patent Office"],2,"A licence is permission to do an exclusive act."],["Assignment and licensing","A sole licence allows:",["No one","Unlimited licensees","Only the licensee","Both licensee and licensor to act"],3,"Normal licences are non-exclusive."],["Assignment and licensing","An exclusive licence excludes:",["The licensee","Competitors only","Even the owner","Nobody"],2,"It can command a higher royalty."]]},{"s":"use","t":"Software licences","pts":["Open source (GPL): source code available, can modify and distribute, usually no warranty.","Shrink-wrap: accepted by opening or use; upheld in Beta v Adobe. Click-wrap untested but likely enforceable.","Freeware is still copyrighted; shareware needs a licence after trial or for commercial use."],"q":[["Software licences","GPL licences usually require:",["No modification","Registration","Source code to be available","Royalties"],2,"Freedom to distribute and change."],["Software licences","Open source software generally has:",["No warranty","Escrow","Exclusive rights","Full warranty"],0,"It may be modified by others."],["Software licences","Shrink-wrap terms are accepted by:",["Paying only","Signing a contract","Opening the packaging or using the software","Registering"],2,"Courts have declared them valid."],["Software licences","Beta v Adobe held the licence was:",["Validly incorporated into the contract on opening","Void","Unenforceable","Only an exemption clause"],0,"It bypassed privity of contract."],["Software licences","Freeware is:",["Free but still copyrighted, with limiting terms","Always open source","Unlicensed","Public domain"],0,"Use can be valid consideration."],["Software licences","Click-wrap licences have:",["Been tested often","Been banned","Not yet been tested in Irish or UK courts","Been rejected"],2,"Courts will likely follow Beta."]]},{"s":"use","t":"Infringement and exceptions","pts":["Independent creation infringes registered rights, not copyright.","Copyright exceptions: transient copies, research, review, reporting news, teaching, backups.","Compulsory licence if the invention isn't worked. Offshore servers don't avoid infringement (Menashe).","ISPs protected as mere conduit, caching, hosting."],"q":[["Infringement and exceptions","Independent creation of something similar infringes:",["Registered rights but not copyright","Both","Neither","Copyright but not registered rights"],0,"Registered rights are monopolies."],["Infringement and exceptions","Which is a copyright exception?",["Adaptation","Broadcasting","Research and private study, criticism or review","Selling copies"],2,"Quotes still need acknowledgement."],["Infringement and exceptions","A compulsory licence is generally granted where:",["A patent expires","The holder fails to 'work' the invention and won't license","The inventor dies","The user pays"],1,"The court sets reasonable terms."],["Infringement and exceptions","Menashe v William Hill: offshore servers:",["Were irrelevant","Were illegal","Avoided infringement","Did not avoid infringement"],3,"Customers used the system in the UK."],["Infringement and exceptions","Framing is seen as:",["A moral right","Always lawful","A plain link","Effectively hijacking another site's content"],3,"Deep linking is controversial for lost ad revenue."],["Infringement and exceptions","ISPs are protected when acting as:",["A licensor","A publisher","A mere conduit, caching or hosting","An author"],2,"Under the E-Commerce Directive."]]},{"s":"use","t":"Enforcement and defences","pts":["Enforcement is slow, costly and complex.","Remedies: injunction (interlocutory then full), damages or account of profits, costs (usually 50-75%). Innocent infringement gets no recompense.","Defences: unjustified threats claim, check validity and scope, counter-claim for revocation, design around or license."],"q":[["Enforcement and defences","A copyright claim must show:",["Copying not independent creation, ownership and protected work","Registration","Novelty","Goodwill"],0,"Three tests because copyright is unregistered."],["Enforcement and defences","Patent infringement occurs if:",["All features of a granted claim are included","Any feature is used","The specification is copied","The abstract is copied"],0,"A missing claim feature means no infringement."],["Enforcement and defences","An interlocutory injunction stops acts:",["After trial","To cancel the right","Before trial, to prevent irrecoverable damage","To pay costs"],2,"The owner must undertake to compensate if they lose."],["Enforcement and defences","An account of profits gives:",["The owner's lost sales","The infringer's profits from the infringement","Nominal damages","Costs"],1,"The owner elects damages or an account."],["Enforcement and defences","The winning party typically recovers about:",["50-75% of costs","All costs","Nothing","10%"],0,"Costs are 'taxed' by the court."],["Enforcement and defences","'Innocent' infringement:",["Gets double damages","Gets no recompense, so mark products with numbers","Gets an injunction only","Is never infringement"],1,"Marking shows others your rights exist."],["Enforcement and defences","An unjustified threat can lead to:",["Damages, a declaration of non-infringement and an injunction","A fine","Nothing","Costs only"],0,"For patents, trade marks and registered designs."],["Enforcement and defences","Revocation of registered rights can be requested:",["Only before grant","Only by the Patent Office","At any time, often as a counter-claim","Only within 5 years"],2,"Main ground: legal requirements not met."],["Enforcement and defences","Registered designs are examined:",["Only for novelty","By the EPO","Little or not at all; validity is tested in court","As strictly as patents"],2,"Unlike patents and trade marks."]]}];
const KEY='moot.ip4.v1';
const SUBJ={pat:'Patents & Know-how',cpy:'Copyright & Databases',mrk:'Marks, Domains & Designs',use:'Owning, Licensing & Enforcing'};
const ALL=D.flatMap((d,u)=>d.q.map((x,i)=>({id:'u'+u+'_'+i,s:d.s,u,t:x[0],q:x[1],o:x[2],a:x[3],e:x[4]})));
const BY=Object.fromEntries(ALL.map(q=>[q.id,q]));
const $=s=>document.querySelector(s),app=$('#app'),hdr=$('#top');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const when=t=>new Date(t).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.sessions))return{sessions:v.sessions,q:v.q||{},len:v.len==null?20:v.len}}catch(e){}return{sessions:[],q:{},len:20}}
let db=load(),view='home',S=null,armed=0,U=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

/* unseen questions first, then ones you missed last time, then the rest; always shuffled across all three subjects */
function pick(n){const b=[[],[],[]];shuf(ALL).forEach(q=>{const r=db.q[q.id];b[!r?0:r.l?2:1].push(q)});const all=b.flat();return shuf(n?all.slice(0,n):all)}

function bar(){hdr.innerHTML=`<button class="logo" data-act="home"><span class="dots"><i data-s="pat"></i><i data-s="cpy"></i><i data-s="mrk"></i><i data-s="use"></i></span>Bukie</button><nav aria-label="Main"><button data-act="home"${view==='home'?' aria-current="page"':''}>Learn</button><button data-act="hist"${view==='hist'?' aria-current="page"':''}>History</button></nav>`}

function home(){
  const st=u=>{const qs=ALL.filter(q=>q.u===u);return[qs.filter(q=>(db.q[q.id]||{}).l===1).length,qs.length]};
  const nx=D.findIndex((d,u)=>{const[a,b]=st(u);return a<b});
  const g=Object.keys(SUBJ).map(k=>{const qs=ALL.filter(q=>q.s===k);return{k,qs,right:qs.filter(q=>(db.q[q.id]||{}).l===1).length}});
  app.innerHTML=`<h1 class="hero">Learn IP, bit by bit.</h1>
<p class="lede">${D.length} short units from Theme 4. Read the key points, then answer questions that check them. ${ALL.length} questions in all, no timer.</p>
<div class="start"><button class="cta" data-act="unit" data-u="${Math.max(nx,0)}">${db.sessions.length?'Continue learning':'Start unit 1'}</button></div>
<section class="map"><h2>Units</h2><p class="key">Each unit is a short lesson plus questions on it. The count is how many you got right last time.</p>
${Object.keys(SUBJ).map(k=>`<div class="grp" data-s="${k}"><div class="gh"><span class="subj">${SUBJ[k]}</span></div>${D.map((d,u)=>d.s!==k?'':`<button class="ghost" style="display:flex;justify-content:space-between;gap:12px;width:100%;margin-bottom:8px" data-act="unit" data-u="${u}"><span>${u+1}. ${esc(d.t)}</span><span class="mut">${st(u).join('/')}</span></button>`).join('')}</div>`).join('')}</section>
<section class="map"><h2>Mixed practice</h2><p class="key">Unseen and missed questions first, shuffled across all units.</p>
<div class="start" style="margin:0 0 44px"><div class="seg" role="group" aria-label="Questions per session">${[10,20,40,0].map(n=>`<button data-act="len" data-n="${n}" aria-pressed="${db.len===n}">${n||'All'}</button>`).join('')}</div><button class="cta" data-act="start">Start practice</button></div></section>
<section class="map"><h2>Question map</h2><p class="key">Solid means right last time, red means missed, faint means unseen.</p>
${g.map(x=>`<div class="grp" data-s="${x.k}"><div class="gh"><span class="subj">${SUBJ[x.k]}</span><span class="mut">${x.right} of ${x.qs.length} right</span></div><div class="tiles">${x.qs.map(q=>{const r=db.q[q.id];return`<i class="${r?(r.l?'r':'w'):''}" title="${esc(q.q)}"></i>`}).join('')}</div></div>`).join('')}</section>`;
}
function unitv(){
  const d=D[U];
  app.innerHTML=`<div class="meta"><span class="subj" data-s="${d.s}">${SUBJ[d.s]}</span><span>Unit ${U+1} of ${D.length}</span></div>
<h1 class="hero sm" style="margin-top:14px">${esc(d.t)}</h1>
<div class="ruling" data-s="${d.s}">${d.pts.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
<div class="start"><button class="cta" data-act="ustart">Check my understanding (${d.q.length})</button><button class="ghost" data-act="home">All units</button></div>`;
}

function begin(list,u){if(!list.length)return;S={u:u==null?null:u,qs:list,i:0,right:0,done:false,res:list.map(()=>null),miss:[],p:{},o:[]};view='quiz';quiz()}

function quiz(){
  const q=S.qs[S.i],n=S.qs.length;
  S.o=shuf(q.o.map((t,k)=>({t,ok:k===q.a})));S.done=false;
  hdr.innerHTML=`<button class="quiet" data-act="end">End session</button><span class="count">${S.i+1} of ${n}</span>`;
  app.innerHTML=`<div class="ribbon" aria-hidden="true" style="gap:${n>60?1:3}px">${S.qs.map((x,k)=>`<i data-s="${x.s}" class="${S.res[k]==='bad'?'bad on':S.res[k]?'on':k===S.i?'now on':''}"></i>`).join('')}</div>
<div class="meta"><span class="subj" data-s="${q.s}">${SUBJ[q.s]}</span><span>${esc(q.t)}</span></div>
<h2 class="q">${esc(q.q)}</h2>
<div class="opts">${S.o.map((o,k)=>`<button class="opt" data-act="pick" data-n="${k}"><span class="k">${'ABCDEF'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
<div id="fb" aria-live="polite"></div>`;
  window.scrollTo(0,0);
}

function choose(n){
  if(!S||S.done||!S.o[n])return;
  S.done=true;
  const q=S.qs[S.i],ok=S.o[n].ok;
  S.res[S.i]=ok?'ok':'bad';
  if(ok)S.right++;else S.miss.push(q.id);
  const p=S.p[q.s]||(S.p[q.s]=[0,0]);p[1]++;if(ok)p[0]++;
  const r=db.q[q.id]||(db.q[q.id]={s:0,w:0});r.s++;r.l=ok?1:0;if(!ok)r.w++;
  save();
  document.querySelectorAll('.opt').forEach((b,m)=>{
    b.disabled=true;
    if(S.o[m].ok){b.classList.add('ok');b.querySelector('.k').textContent='\u2713'}
    else if(m===n){b.classList.add('no');b.querySelector('.k').textContent='\u2715'}
    else b.classList.add('dim');
  });
  document.querySelectorAll('.ribbon i')[S.i].className=ok?'on':'bad on';
  $('#fb').innerHTML=`<div class="ruling" data-s="${q.s}"><b class="${ok?'g':'r'}">${ok?'Correct':'Not quite'}</b><p>${esc(q.e)}</p></div><div class="actions"><button class="cta" data-act="next">${S.i+1<S.qs.length?'Next question':'See results'}</button></div>`;
  $('#fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}

function finish(){
  const n=S.res.filter(Boolean).length;
  if(n){db.sessions.unshift({t:Date.now(),n,r:S.right,p:S.p,m:S.miss});db.sessions=db.sessions.slice(0,100);save()}
  view=n?'results':'home';render();
}

const missed=ids=>ids.filter(id=>BY[id]).map(id=>{const q=BY[id];return`<article class="miss" data-s="${q.s}"><span class="subj">${SUBJ[q.s]}</span><h3>${esc(q.q)}</h3><p class="ans">${esc(q.o[q.a])}</p><p class="why">${esc(q.e)}</p></article>`}).join('');

function results(){
  const n=S.res.filter(Boolean).length,p=Math.round(S.right/n*100);
  const msg=!S.miss.length?'No misses. Run another round to keep it fresh.':p>=80?'Strong round. The questions you missed are below.':p>=60?'Solid. Go through what you missed below.':'Keep going. Each missed question below comes with its explanation.';
  app.innerHTML=`<h1 class="hero sm">You got ${S.right} of ${n}.</h1><p class="lede">${p}%. ${msg}</p>
<div class="rows">${Object.keys(SUBJ).filter(k=>S.p[k]).map(k=>`<div class="prow" data-s="${k}"><span class="subj">${SUBJ[k]}</span><span class="fr">${S.p[k][0]} of ${S.p[k][1]}</span><div class="track"><i style="width:${S.p[k][0]/S.p[k][1]*100}%"></i></div></div>`).join('')}</div>
<div class="start" style="margin:12px 0 34px"><button class="cta" data-act="again">${S.u!=null?'Redo unit':'Practice again'}</button>${S.u!=null&&S.u+1<D.length?`<button class="ghost" data-act="unit" data-u="${S.u+1}">Next unit</button>`:''}${S.miss.length?`<button class="ghost" data-act="retry">Retry ${S.miss.length} missed</button>`:''}</div>
${S.miss.length?`<h2 class="sec">Missed</h2>${missed(S.miss)}`:''}`;
}

function hist(){
  const ss=db.sessions;
  if(!ss.length){app.innerHTML=`<h1 class="hero sm">History</h1><p class="lede">Nothing here yet. Finish a practice session and it will appear here with your score and the questions you missed.</p><div class="start"><button class="cta" data-act="home">Start practising</button></div>`;return}
  const pc=s=>Math.round(s.r/s.n*100);
  const avg=Math.round(ss.reduce((a,s)=>a+pc(s),0)/ss.length),best=Math.max(...ss.map(pc));
  app.innerHTML=`<h1 class="hero sm">History</h1>
<p class="sum"><b>${ss.length}</b> ${ss.length===1?'session':'sessions'}, <b>${avg}%</b> average, best <b>${best}%</b>.</p>
<div class="trend" role="img" aria-label="Scores of your most recent sessions, oldest to newest">${ss.slice(0,24).reverse().map(s=>`<i title="${when(s.t)}: ${pc(s)}%"><b style="height:${Math.max(pc(s),3)}%"></b></i>`).join('')}</div>
<div>${ss.map(s=>`<details class="sess"><summary><span class="when">${when(s.t)}</span><span class="mix">${Object.keys(SUBJ).filter(k=>s.p[k]).map(k=>`<span class="mb" data-s="${k}" title="${SUBJ[k]}: ${s.p[k][0]} of ${s.p[k][1]}"><i style="width:${s.p[k][0]/s.p[k][1]*100}%"></i></span>`).join('')}</span><span class="sc"><b>${s.r}/${s.n}</b> ${pc(s)}%</span></summary><div class="sbody">${s.m.length?`<button class="ghost" data-act="redo" data-ids="${s.m.join(',')}">Practise these ${s.m.length} again</button>${missed(s.m)}`:'<p class="mut">No misses in this session.</p>'}</div></details>`).join('')}</div>
<button class="quiet danger" data-act="clear">Clear history and progress</button>`;
}

function render(){window.scrollTo(0,0);if(view==='quiz')return quiz();bar();({home,hist,results,unit:unitv})[view]()}

function act(a,b){
  if(a==='home'){view='home';render()}
  else if(a==='hist'){view='hist';render()}
  else if(a==='len'){db.len=+b.dataset.n;save();document.querySelectorAll('[data-act=len]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
  else if(a==='start')begin(pick(db.len));
  else if(a==='again')S&&S.u!=null?begin(ALL.filter(q=>q.u===S.u),S.u):begin(pick(db.len));
  else if(a==='unit'){U=+b.dataset.u;view='unit';render()}
  else if(a==='ustart')begin(ALL.filter(q=>q.u===U),U);
  else if(a==='pick')choose(+b.dataset.n);
  else if(a==='next'){S.i++;S.i<S.qs.length?quiz():finish()}
  else if(a==='end')finish();
  else if(a==='retry')begin(shuf(S.miss.map(id=>BY[id])));
  else if(a==='redo')begin(shuf(b.dataset.ids.split(',').filter(id=>BY[id]).map(id=>BY[id])));
  else if(a==='clear'){
    if(!armed){armed=1;b.textContent='Tap again to erase all history and progress';setTimeout(()=>{armed=0;if(b.isConnected)b.textContent='Clear history and progress'},4000)}
    else{armed=0;db={sessions:[],q:{},len:db.len};save();render()}
  }
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!S||e.metaKey||e.ctrlKey||e.altKey)return;
  if(!S.done){if(e.key.length===1){const i='1234'.indexOf(e.key),j='abcd'.indexOf(e.key.toLowerCase()),k=i>-1?i:j;if(k>-1)choose(k)}}
  else if(e.key==='Enter'){e.preventDefault();act('next')}
});

render();
})();
</script>
</body>
</html>
