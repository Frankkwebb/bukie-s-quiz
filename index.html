<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bukie: practice quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{
  --bg:#f6f7fa;--sf:#ffffff;--ink:#101935;--mut:#636d86;--line:#dfe3ec;--soft:#eceff5;
  --law:#2b50ff;--eth:#c13ee0;--con:#f0a000;
  --ok:#14804a;--okb:#e5f5ec;--no:#d23c3c;--nob:#fdeaea;--btn:#101935;--btnx:#ffffff;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--sf:#161a24;--ink:#e9ecf8;--mut:#98a0b5;--line:#272c3a;--soft:#1d2230;--law:#8095ff;--eth:#dd8cf2;--con:#ffc247;--ok:#4cd68a;--okb:#12301f;--no:#ff7a7a;--nob:#381a1c;--btn:#e9ecf8;--btnx:#0e1118;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0e1118;--sf:#161a24;--ink:#e9ecf8;--mut:#98a0b5;--line:#272c3a;--soft:#1d2230;--law:#8095ff;--eth:#dd8cf2;--con:#ffc247;--ok:#4cd68a;--okb:#12301f;--no:#ff7a7a;--nob:#381a1c;--btn:#e9ecf8;--btnx:#0e1118;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.shell{max-width:700px;margin:0 auto;padding:18px 20px 80px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
[data-s=law]{--c:var(--law)}[data-s=eth]{--c:var(--eth)}[data-s=con]{--c:var(--con)}

.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:30px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.dots{display:flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.top nav{display:flex;gap:6px}
.top nav button{padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:600}
.top nav button[aria-current=page]{color:var(--ink);background:var(--soft)}
.quiet{color:var(--mut);font-weight:600;padding:8px 0}
.count{color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}

.hero{font-weight:720;font-size:clamp(44px,11.5vw,86px);line-height:.96;letter-spacing:-.035em;margin:0 0 20px;text-wrap:balance}
.hero.sm{font-size:clamp(36px,8.5vw,56px);line-height:1.02}
.lede{color:var(--mut);font-size:19px;line-height:1.5;max-width:46ch;margin:0}
.start{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:32px 0 56px}
.seg{display:inline-flex;background:var(--soft);border-radius:13px;padding:4px;gap:2px}
.seg button{padding:10px 16px;border-radius:10px;font-weight:600;color:var(--mut);min-width:48px;text-align:center}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(16,25,53,.14)}
.cta{background:var(--btn);color:var(--btnx);border-radius:14px;padding:16px 28px;font-weight:650;font-size:18px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.ghost{border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:600;transition:border-color .12s}
.ghost:hover{border-color:var(--ink)}

h2.sec,.map h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.key{color:var(--mut);font-size:15px;margin:0 0 24px;max-width:56ch}
.grp{margin-bottom:26px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.subj{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.subj::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.mut{color:var(--mut);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
.tiles i{aspect-ratio:1;border-radius:4px;background:var(--c);opacity:.18}
.tiles i.r{opacity:1}.tiles i.w{background:var(--no);opacity:1}

.ribbon{display:flex;align-items:center;height:14px;margin-bottom:26px}
.ribbon i{flex:1;min-width:1px;height:5px;border-radius:3px;background:var(--c);opacity:.2;transition:opacity .2s,background .2s}
.ribbon i.on{opacity:1}.ribbon i.bad{background:var(--no)}.ribbon i.now{height:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mut);font-size:15px}
.meta .subj{color:var(--ink);font-size:16px}
.q{font-weight:620;font-size:clamp(23px,5vw,31px);line-height:1.22;letter-spacing:-.015em;margin:14px 0 26px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sf);line-height:1.4;transition:border-color .12s,background .12s,opacity .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no .k{background:var(--no);color:#fff}
.opt.dim{opacity:.5}
.ruling{margin-top:24px;border-left:3px solid var(--c);padding:2px 0 2px 18px;animation:rise .22s ease-out}
.ruling b{font-size:19px;font-weight:700}.ruling b.g{color:var(--ok)}.ruling b.r{color:var(--no)}
.ruling p,.why{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:19px;line-height:1.6;margin:6px 0 0;max-width:62ch}
.actions{position:sticky;bottom:0;margin-top:22px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

.prow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin:0 0 18px}
.prow .fr{font-variant-numeric:tabular-nums;color:var(--mut)}
.track{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:4px;animation:grow .6s ease-out}
@keyframes grow{from{width:0}}
.rows{margin-top:30px;max-width:520px}
.miss{border-top:1px solid var(--line);padding:22px 0}
.miss h3{font-size:21px;line-height:1.28;font-weight:600;letter-spacing:-.01em;margin:10px 0 12px}
.ans{margin:0 0 8px;color:var(--ok);font-weight:600}
.ans::before{content:"\2713\00a0"}
.why{margin:0}

.sum{font-size:clamp(22px,5vw,30px);line-height:1.25;font-weight:500;color:var(--mut);margin:0 0 26px}
.sum b{color:var(--ink);font-weight:720}
.trend{display:flex;gap:4px;height:84px;margin-bottom:34px}
.trend i{flex:1;max-width:28px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
.trend b{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.88;border-radius:5px 5px 0 0}
.sess{border-top:1px solid var(--line)}
.sess:last-of-type{border-bottom:1px solid var(--line)}
.sess summary{list-style:none;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:16px 0;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin-left:2px;transition:transform .15s}
.sess[open] summary::after{transform:rotate(-135deg)}
.when{flex:1 1 150px;font-weight:600}
.mix{display:flex;gap:5px}
.mb{display:block;width:34px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.mb i{display:block;height:100%;background:var(--c)}
.sc{font-variant-numeric:tabular-nums;color:var(--mut)}.sc b{color:var(--ink)}
.sbody{padding:0 0 12px}.sbody .ghost{margin-bottom:6px}
.danger{margin-top:40px;color:var(--no)}

@media (max-width:480px){.shell{padding:14px 16px 72px}.opt{padding:14px}.lede{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell"><header class="top" id="top"></header><main id="app"></main></div>
<script>
(()=>{
const D=[{"k":"law","q":[["Module & Assessment","How is this module assessed?",["50% exam, 50% CA","100% continuous assessment","100% final exam","70% CA, 30% project"],1,"The module is 100% continuous assessment (CA) with no supplementals. CA1–CA11 are spread over weeks 2–12, and three of them (CA4, CA8, CA11) are worth 20% each while the rest are 5% each."],["Module & Assessment","A student misses a class test for a medical reason but supplies no certification. What mark do they receive?",["Average of other tests","Zero for that assessment","A 50% pass","They can resit freely"],1,"Where certification is not supplied the student gets zero. Even with certification, this relief is available for a maximum of one class test; anything further is discretionary only."],["Nature of Law & ICT","'The law never speaks but to command, nor commands but where it can compel.' Who said this?",["Colmcille","William Paley","Magna Carta","Grattan"],1,"William Paley. The quote stresses that law is defined by authority and enforceability: it commands, and it only commands where it can compel obedience."],["Nature of Law & ICT","Which area of tort law is on the slide as relevant to ITC professionals?",["Negligence (duty of care)","Probate","Admiralty","Land registration"],0,"Torts for ITC professionals: negligence (including duty of care), nuisance and defamation. Other relevant areas are contracts (offer, acceptance, consideration, T&Cs, eCommerce), data privacy, IP and criminal law."],["Nature of Law & ICT","Which of these is an element needed to form a valid contract?",["Consideration","Fealty","Homage","Tithing"],0,"Offer, acceptance and consideration are the core elements of a contract. Fealty, homage and tithing are feudal concepts."],["Nature of Law & ICT","Which IP right protects compilations of data, per the slides' list of IP rights?",["Patent","Database right","Trademark","Design right"],1,"Database right (see EC Directive 96/9). The slide's IP list: copyright, trademarks, patents, design rights, database right."],["Common Law & Feudalism","Who introduced feudal law to England, and in which year was Hastings?",["Henry II, 1215","William the Conqueror, 1066","King John, 1066","William of Orange, 1689"],1,"William the Conqueror, after Hastings in 1066. He imposed feudal ownership and control on top of existing local laws and standardised them into a 'Common Law'."],["Common Law & Feudalism","What was the 'Curia Regis'?",["The Irish parliament","The King's Court","A Brehon law text","The Council of Ministers"],1,"Curia Regis = King's Court. It assisted the king with legislative, administrative and judicial work and later evolved into specialised courts."],["Common Law & Feudalism","Common law is best described as law found in…",["Ancient local customs","Recorded decisions of the courts","The Bible","Treaties only"],1,"Common law is found in recorded court decisions, not in ancient custom. This is why ancient custom is rarely a source of law today (rare exception: the Foyle Fisheries case)."],["Common Law & Feudalism","What was 'tithing' used for?",["Collecting church tax","Making communities police themselves in groups of 10","Selecting jurors","Granting land"],1,"Population was divided into groups of 10; if any member committed a serious offence the whole tithe was punished, so people policed themselves."],["Common Law & Feudalism","Under English feudal law, who owned all the land?",["The barons","The Church","The King","The serfs"],2,"The king owned all England and granted land to great vassals (barons/lords) in return for service, fealty and homage, otherwise it was forfeited. They sub-granted to mesne lords; occupiers (serfs) had no title."],["Parliament","Why did Norman kings first call meetings of the great vassals, the origin of Parliament?",["To pass the Magna Carta","To vote money (taxes) for wars","To elect a king","To appoint judges"],1,"Kings constantly at war in Europe needed funds and called barons, lords and bishops to 'parley' to vote money. Later Parliament presented petitions ('Bills') in return, and Bills became Acts."],["Parliament","What did the Magna Carta (1215) do?",["Created the House of Commons","Curtailed the king's arbitrary power and introduced juries","Abolished feudalism","Established the ECJ"],1,"Barons forced King John to sign it at Runnymede. It recognised rights of lords, the Church and free men, and no freeman was to be convicted except by a jury of his peers."],["Parliament","What did the Bill of Rights 1689 oblige William of Orange to do?",["Abolish Parliament","Call Parliament at least once a year to approve expenditure and taxation","Rule Ireland directly","Sign the Poynings' Law"],1,"After James II ignored Parliament and was removed, William accepted the throne conditional on this. Since then Parliament has been the real power and the monarch's signature a rubber stamp."],["Celtic & Brehon Law","What were the Brehon Laws written in and who preserved them?",["Latin, by clergy only","Cryptic verse triads, memorised by the fili","Plain prose, by kings","Greek, by druids"],1,"They used cryptic language and triads (groups of three), were the responsibility of the fili (poets/learned people) and passed on word-perfect orally; lawyers spent up to 20 years learning them."],["Celtic & Brehon Law","How was wrongdoing mainly redressed in Celtic Ireland?",["Prison","Death penalty","Monetary compensation","Exile"],2,"There were no prisons; wrong was redressed by compensation (honour-price based). This is why rich people could abuse the poor cheaply, which fed into the Tara crisis."],["Celtic & Brehon Law","What was the Feis at Tara?",["A battle","A triennial gathering including a conference of brehons","A tax","A trial by combat"],1,"A triennial gathering at Tara with games, music and a conference of the brehons. Whoever ruled Tara was considered High King, and the king was subject to the law."],["Celtic & Brehon Law","How did Christianity change Irish law in the first millennium?",["It introduced polygamy","It brought 'a life for a life', monogamy and election within the king's kin","It abolished Brehon law","It created Parliament"],1,"Druids gave way to clergy, magic-rite king selection to kin election; clergy demanded punishment (life for life, death for rape) and monogamy, whereas Brehon law allowed polygamy, divorce and trial marriage."],["Celtic & Brehon Law","What was the 'latent function' of the 'life for life' reform that ended Tara (554 AD)?",["Protecting common people","The powerful used it to their own advantage (High King Diarmuid executed a disagreeable subject)","Ending polygamy","Creating juries"],1,"Manifest function: protect the lower orders from abuse by the wealthy. Latent function: powerful people best exploit any law. Saint Ruadhán fasted in protest and Tara was abandoned."],["Celtic & Brehon Law","What was the outcome of Drom Ceat (575 AD)?",["Brehon laws abolished","Colmcille defended them and they were retained","Tara restored","Norman invasion"],1,"Colmcille defended the Brehon Laws; canon law was seen as a guide to conscience and Brehon law as practical solutions. Result: Brehon laws kept and clergy opposition ended."],["Irish Legal History","What did Poynings' Law do?",["Granted Irish independence","Applied English statutes in Ireland and limited the Irish Parliament","Created the Dáil","Partitioned Ireland"],1,"It declared English statutes carry in Ireland; the Irish privy council decided Irish bills, later ratified by the Crown, leaving the Irish Parliament largely impotent."],["Irish Legal History","Which sequence is correct?",["Act of Union 1800 → Dependency Act 1719 → Free State 1921","Dependency of Ireland Act 1719 → repealed 1782 → Act of Union 1800","Poynings → Magna Carta → Hastings","Free State 1922 → Republic 1948 → Partition 1920"],1,"1719: London may legislate directly for Ireland. 1782 (Grattan): repealed it and Poynings' Law. 1798 rebellion, then the Act of Union 1800 formed the UK of Great Britain and Ireland."],["Irish Legal History","What did the Government of Ireland Act 1920 do?",["Declared a republic","Partitioned north/south","Created the EU","Abolished Brehon law"],1,"It partitioned Ireland; the Anglo-Irish Treaty (Dec 1921) created the Irish Free State with dominion status. The Free State Constitution passed in Oct 1922; Bunreacht na hÉireann followed in 1937, and the Republic of Ireland Act in 1948."],["Irish Legal History","What does Article 50 of the Constitution provide?",["Pre-1937 laws continue until repealed or amended by the Oireachtas","All old law is void","EU law prevails","Judges are elected"],0,"Laws in force in Saorstát Éireann continue in full force unless inconsistent with the Constitution, until repealed or amended by the Oireachtas, which is how common law and older statutes were received."],["Irish Legal History","Which is NOT one of the four sources of Irish law on the slides?",["Common law","Legislature","Constitution","Canon law"],3,"The sources of Irish law: common law, the legislature, the Constitution and Europe."],["Precedent & Interpretation","What is the 'ratio decidendi'?",["A passing comment by a judge","The reason for deciding, which binds lower courts","A court's costs order","A statute's preamble"],1,"The ratio is the rule of law/reason for the decision; it binds lower courts to the extent relevant ('in point'). Obiter dicta are non-essential remarks, not binding (e.g. High Trees)."],["Precedent & Interpretation","What is persuasive precedent?",["A binding decision","A decision a court isn't bound by but may follow","A decision of the ECJ","A decision of a jury"],1,"Courts can look to other jurisdictions (US, Australia, Canada, NZ, South Africa etc.) for persuasive authority, without being bound."],["Precedent & Interpretation","Which is NOT a benefit of precedent?",["Consistency/fairness","Certainty","Saves time","Allows rapid constitutional change"],3,"Benefits: consistency, certainty, time saving, and realism ('forged on the anvil of reality'). Precedent actually favours stability, not rapid change."],["Precedent & Interpretation","'Ejusdem generis' means that general words after a list are…",["Read literally","Limited to things of the same kind as those listed","Ignored","Read to include everything"],1,"Of the same kind/class. Related: expressio unius (naming one excludes others), noscitur a sociis (meaning from associates), rule of lenity (criminal statutes read narrowly)."],["Precedent & Interpretation","Which approach is commonly used to interpret EU law?",["Literal","Golden rule","Mischief rule","Purposive approach"],3,"Purposive: interpret in keeping with the legislation's purpose. Literal = plain meaning even if absurd; golden = plain meaning unless absurd; mischief = what problem Parliament aimed to remedy."],["Irish Courts","Which court sits with 3 judges and no jury?",["Circuit Court","Central Criminal Court","Special Criminal Court","District Court"],2,"The Special Criminal Court: 3 judges, no jury (panel of 11 drawn from High, Circuit and District Courts). Appeals go to the Court of Appeal."],["Irish Courts","What are the civil monetary limits of the District and Circuit Courts?",["€15,000 and €75,000","€5,000 and €25,000","€75,000 and unlimited","€1,000 and €15,000"],0,"District Court: up to €15,000; Circuit Court: up to €75,000; High Court: unlimited. Hierarchy: District → Circuit → High → Court of Appeal → Supreme."],["EU Law","Which treaty created the European Union (1993)?",["Treaty of Rome","Maastricht Treaty","Treaty of Versailles","Treaty of Limerick"],1,"The EU was established by the Maastricht Treaty (1993), growing from the European Coal and Steel Community of 1952."],["EU Law","Which EU institution has the sole right to initiate legislation?",["Parliament","Commission","Court of Auditors","ECJ"],1,"The Commission, the EU's 'government', initiates. Council of Ministers is the highest decision- and law-making body; Parliament gives democratic legitimacy but cannot introduce legislation."],["EU Law","Which EU measure applies in all Member States as law without further action?",["Directive","Regulation","Opinion","Recommendation"],1,"Regulations apply directly (e.g. GDPR). Directives bind as to result but leave implementation form to each state; Decisions bind only addressees; opinions and recommendations are not enforceable."],["EU Law","What did Francovich v Italy establish?",["Stare decisis in ECJ","Right to damages where a state failed to transpose a Directive","Regulations are optional","The Commission can veto Parliament"],1,"The ECJ gave a citizen damages against a Member State that failed to implement a Directive. The ECJ has no doctrine of stare decisis, since judgments bind only the parties."],["Classification","How do civilian and common law systems differ?",["Civilian is based on principle; common law on precedent","They are identical","Civilian relies on juries","Common law relies on codes"],0,"Civilian systems apply legal principles; common law systems examine earlier court decisions. Mixed systems exist (e.g. Scotland)."],["Classification","Contract, tort and family law belong to…",["Public law","Private law","Constitutional law","Criminal law"],1,"Private law regulates individuals (family, succession, contract, tort, property). Public law covers constitutional, local government and criminal law, regulating the state vs citizen."],["Nature of Law & ICT","Which of the Ten Commandments is 'Thou shalt not kill'?",["Third","Fourth","Fifth","Seventh"],2,"It is the 5th. Slide order: 1 no strange gods, 2 name in vain, 3 Sabbath, 4 honour parents, 5 not kill, 6 adultery, 7 steal, 8 false witness, 9 covet wife, 10 covet goods. Used to show where law/moral rules originate."],["Common Law & Feudalism","When did the Roman army leave England, causing chaos?",["55 BC","500 AD","1066","1215"],1,"Caesar conquered around 55 BC, bringing peace and equality for Roman citizens. About 500 AD the army left; Angles and Saxons invaded and Roman law left no trace."],["Common Law & Feudalism","What was 'compurgation'?",["Trial by combat","Repeating an oath word-perfect without stumbling","Paying a fine","A jury verdict"],1,"One of the crude Anglo-Saxon methods, alongside trial by combat, ordeal and immersion. Vikings later brought further chaos until Irish/Continental missionaries restored Christianity and literacy."],["Common Law & Feudalism","Which was NOT an early Anglo-Saxon method of trial?",["Trial by combat","Ordeal","Trial by a jury of peers","Compurgation"],2,"Juries came later (Magna Carta 1215: no freeman convicted except by verdict of his peers). Anglo-Saxon methods were combat, ordeal/immersion and compurgation."],["Common Law & Feudalism","Who supervised the Manorial Courts and who supervised Local Courts?",["Sheriffs; Justices of the Peace","Barons; Bishops","Judges; Coroners","Lords; Sheriffs"],0,"Landlords held Manorial Courts, supervised by Sheriffs; Justices of the Peace supervised Local Courts, with soldiers assisting both. Existing local courts were continued."],["Common Law & Feudalism","How was uniformity achieved in common law?",["Many new decrees","Central control of courts by sheriffs/justices and centralised sitting of principal courts","Local customs","Church canon law"],1,"William made few new laws; the courts' function was to enforce existing law. Uniformity came from central control, then stare decisis: similar future cases decided the same way."],["Common Law & Feudalism","What happened to land occupiers such as serfs under feudalism?",["They held title","They had no title and were tenants at will","They became barons","They paid no service"],1,"Land passed from king to great vassals to mesne lords; occupiers (serfs) had no title and were tenants at will. Land granted to Bishops carried different duties."],["Parliament","What made Bills into binding Acts of Parliament in Norman times?",["Jury vote","The king's signature","Church approval","Sheriffs"],1,"Parliament presented petitions ('Bills') in return for voting money; Bills became Acts/Statutes, legally binding through the king's signature."],["Parliament","Which Irish-connected baron was involved in the Magna Carta?",["Dermot MacMurrough","William Marshall, Earl of Pembroke","Rory O'Connor","Strongbow"],1,"Some Irish barons were involved. Norman-Irish knew how an Irish king's powers were curtailed under Brehon Law."],["Parliament","What happened in 1265 in Parliament?",["Magna Carta signed","City and Borough reps called, origin of the House of Commons","Bill of Rights","Parliament abolished"],1,"Lords and Commons met separately, the origin of the House of Lords and House of Commons."],["Celtic & Brehon Law","Approximately how many kingdoms were in Celtic Ireland?",["5","50","150","1,000"],2,"About 150. Local kings paid tribute to regional/provincial kings, who paid tribute to a High King, in return for protection."],["Celtic & Brehon Law","Who defeated the Celts' Vercingetorix (Arverni) in 52 BC, marking Celtic decline?",["William","Caesar","Henry II","Colmcille"],1,"Caesar. Celts had a warrior culture, no centralised state, no reading or writing (learning memorised and passed on orally)."],["Celtic & Brehon Law","Since when was Tara a ritual centre?",["Neolithic (about 4,000 BC)","554 AD","1066","1215"],0,"Tara, County Meath, a ritual centre since Neolithic times; whoever ruled Tara was considered High King."],["Celtic & Brehon Law","In the Celtic status structure, who was at the top?",["Brehons","Kings = druids = fili","Harpists","Princes"],1,"Next came brehons, medical specialists and harpists, then princes, landowners, free tenants, client-tenants, and finally unfree tenants and bonded servants."],["Celtic & Brehon Law","What could happen to a debtor in Celtic society?",["Imprisoned","Bonded to a creditor and sold to another until repaid","Exiled","Executed"],1,"There were no prisons. Debt bondage, plus monetary compensation for wrongs, was the system."],["Celtic & Brehon Law","The Brehon triad names which three foundations of law and custom?",["Order, justice, peace","King, church, people","Land, cattle, tribute","Honour, fealty, homage"],0,"A silent mouth, a careful ear and a fitting action were the three foundations of success, an example of triads."],["Celtic & Brehon Law","What did the clergy do after Colmcille?",["Burned Brehon texts","Sponsored written recording of folklore and Brehon Laws","Abolished the fili","Moved Tara"],1,"Earlier clergy disregarded folklore and relied on written Bible texts; after Colmcille they sponsored recording much of it in writing."],["Irish Legal History","When was the Parliament of Ireland set up, and what limited it?",["About 1310; only bills presented by the king's representative","1800; no limits","1919; Dáil","1066; none"],0,"It could consider only bills from the king's representative, and the English parliament also held itself entitled to legislate for Ireland."],["Irish Legal History","What happened in 1607 in Ireland?",["Act of Union","English law extended to all Ireland","Free State created","Dáil formed"],1,"After the Norman arrival (12th c., Henry II), English rule was limited to the Pale until the 15th c.; conquest was completed 16th–17th c. Normans became 'as Irish as the Irish themselves'."],["Irish Legal History","What happened in January 1919?",["Treaty signed","Sinn Féin members met in Dublin and constituted Dáil Éireann","Partition","Republic declared in law"],1,"They drew up the Constitution of Dáil Éireann and a Declaration of Independence; Britain reacted with the Government of Ireland Act 1920."],["Irish Legal History","Order of authority declared in the Free State Constitution?",["God > People > Government","Crown > Parliament > People","People > God > Crown","Government > Church > People"],0,"It did not create a new set of laws but declared old law existed until repealed. Contentious: Oath of Allegiance, Governor General, references to the Crown."],["Irish Legal History","What did the Republic of Ireland Act 1948 do?",["Created the Free State","Removed External Affairs from the Crown","Partitioned Ireland","Joined the EU"],1,"Edward's abdication in 1936 gave the opportunity; Bunreacht na hÉireann followed in 1937, then the Republic in 1948."],["Precedent & Interpretation","Which case is the slide's example of obiter dictum?",["Francovich","Central London Property Trust v High Trees","Foyle Fisheries","Magna Carta"],1,"Obiter comments are not relevant to the claims decided and so don't bind other courts."],["Precedent & Interpretation","What is the 'golden rule'?",["Always literal meaning","Plain meaning unless it leads to an absurd result","Look at the mischief","Follow EU purpose"],1,"The literal approach applies plain meaning even if harsh or absurd; the mischief rule asks what 'mischief' Parliament sought to remedy."],["Precedent & Interpretation","'Noscitur a sociis' means:",["One expression excludes others","A word is known from its associates","Of the same kind","Narrow criminal reading"],1,"Ambiguous words take meaning from surrounding words and context."],["Irish Courts","How many judges are on the Special Criminal Court panel?",["3","7","11","37"],2,"A panel of 11 drawn from High, Circuit and District Courts; it sits with 3 judges, no jury."],["Irish Courts","Which court hears the criminal side of the High Court?",["District Court","Central Criminal Court","Circuit Court","Court of Auditors"],1,"The Central Criminal Court is the criminal division of the High Court, which has unlimited civil jurisdiction."],["EU Law","How often does the Council presidency rotate?",["Every month","Every six months","Every 5 years","Never"],1,"The lack of continuity can affect effectiveness; decisions are usually by qualified majority voting."],["EU Law","What can the Court of First Instance (1989) NOT do?",["Hear direct actions","Give Preliminary Rulings","Sit in Luxembourg","Decide fines"],1,"It deals with direct actions by natural and legal persons but cannot give Preliminary Rulings."],["EU Law","The three Communities in the EU are:",["EC, ECSC, Euratom","ECJ, EP, EC","NATO, UN, EC","EEC, Council, ECSC"],0,"The EC forms the bulk of the EU."],["EU Law","Directive 95/46/EC (data protection) was repealed by:",["Directive 96/9","GDPR (Regulation 2016/679)","Directive 97/7","Maastricht"],1,"GDPR is a Regulation, directly applicable. Other directives listed: 96/9 database, 97/7 distance selling, 2001/29 copyright."],["EU Law","What does co-decision (Maastricht) give Parliament?",["Right to initiate","Right to veto, usually securing amendments","Judicial power","Presidency"],1,"Parliament cannot introduce legislation itself; the Commission does."],["Classification","What is private law often called?",["Black letter law","Red letter law","Statute law","Canon law"],0,"It regulates individuals: family, succession, contract, tort and property."],["Module & Assessment","In which weeks are the three 20% assessments (CA4, CA8, CA11)?",["Weeks 2, 3, 4","Weeks 5, 9, 12","Weeks 6, 7, 8","Weeks 10, 11, 12"],1,"CA4 = week 5, CA8 = week 9, CA11 = week 12 (20% each). The other eight CAs are 5% each, giving 8x5 + 3x20 = 100%. Dates may change, so students must check for updates."],["Module & Assessment","How many continuous assessments (CA1-CA11) are there?",["8","10","11","12"],2,"Eleven CAs run from week 2 to week 12, with no supplementals."],["Nature of Law & ICT","Which is listed under 'Contracts' for ITC professionals?",["Defamation","T&Cs","Trademarks","Nuisance"],1,"Contracts: eCommerce, offer, acceptance, consideration and T&Cs. Defamation and nuisance are torts; trademarks are IP."],["Nature of Law & ICT","Which is a tort relevant to ITC professionals?",["Defamation","Consideration","Fealty","Patents"],0,"Torts: negligence (duty of care), nuisance and defamation."],["Common Law & Feudalism","Who were the 'Tenants in Chief' linked to the Curia Regis?",["Serfs","The king's great vassals","Sheriffs","Brehons"],1,"Great vassals held land directly from the king under service, fealty and homage; William's structure of administration was based on existing local laws."],["Common Law & Feudalism","What happened to Irish customs when English Common Law arrived in Ireland?",["They were kept","They were disregarded and superseded","They merged equally","They became canon law"],1,"Irish ways and customs were disregarded and English Common Law superseded them."],["Common Law & Feudalism","Which is an example of a common law jurisdiction on the world map slide?",["Australia","Brazil","China","Russia"],0,"Dark blue = common law (e.g. USA, Canada, UK, Australia, NZ); light blue = mixed systems using common law."],["Common Law & Feudalism","Precedent is described as 'forged on the anvil of reality'. In contrast to…",["Customs","Legislation","Treaties","Canon law"],1,"Case law arises from real disputes, whereas legislation is drafted in the abstract."],["Parliament","What did 'Parliament' (from 'parler') originally mean?",["To vote","To parley or talk","To fight","To tax"],1,"The king called great vassals to parley (parler) to vote money."],["Parliament","Who did the parliamentarians offer the throne to in 1689?",["William of Orange","King John","Edward","Henry II"],0,"James II's son-in-law William of Orange accepted conditional on signing the Bill of Rights."],["Celtic & Brehon Law","How was a Celtic king selected after Christianity?",["Magic rites","Election within the dead king's kin","Pope","Parliament"],1,"Selection by magic rites was replaced by election within the dead king's kin."],["Celtic & Brehon Law","What was the highest level of marriage under Brehon law?",["Rape placing obligations on the man","Formal agreement between two propertied persons","Trial marriage","Cohabitation"],1,"The lowest level was a union by rape, which placed obligations on the man. Brehon law allowed polygamy, divorce and trial marriages."],["Celtic & Brehon Law","What did 'Tara's Feis' bring together?",["Only kings","People from all over Ireland with games, music and brehons' conference","Vikings","Clergy only"],1,"Held every three years, it was the high point of Celtic Ireland's legal culture."],["Celtic & Brehon Law","What were the consequences of the fall of Tara?",["Stronger High Kingship","Political instability; no more Feis or brehon conferences; few Brehon updates","Norman invasion","Union"],1,"High Kingship was then based on balance of power."],["Irish Legal History","Which Irish statute illustrated Poynings' effect (Statute of Frauds)?",["1677 English, 1695 in Ireland","1066","1800","1937"],0,"The delay shows the Irish Parliament was impotent: English law reached Ireland years later."],["Irish Legal History","What triggered the 1782 repeal of Poynings' Law?",["American Independence and the Irish Volunteers; Grattan","The Act of Union","The famine","Henry II"],0,"Panic at American independence and the Volunteers let Grattan secure legislative independence."],["Irish Legal History","What did the 1922 Free State Constitution serve as?",["Yardstick for legitimacy of all other laws","A treaty","A statute only","A custom"],0,"It was innovative: organs of state and fundamental freedoms."],["Precedent & Interpretation","What is the 'rule of lenity'?",["Criminal statutes construed narrowly","Literal reading","Purposive reading","Follow EU"],0,"Doubts in criminal statutes are resolved narrowly (in the accused's favour)."],["Precedent & Interpretation","Which doctrine is precedent part of?",["Legal certainty","Feudalism","Subsidiarity","Tithing"],0,"Like cases should be decided alike; case law is not changed without good reason."],["Precedent & Interpretation","Which court's ratio binds lower courts?",["Higher court","Same-level only","Foreign court","Any court"],0,"A higher court's ratio binds lower courts; foreign decisions are only persuasive."],["Irish Courts","How many ordinary judges does the District Court have?",["37","36","63","9"],2,"District Court: President + 63 ordinary judges. Circuit: President, 37 ordinary + 6 specialist judges. High Court: President + 36 ordinary."],["Irish Courts","The Supreme Court consists of:",["Chief Justice + 9 judges","President + 36","3 judges","11 judges"],0,"The Court of Appeal has a President + 9 judges."],["EU Law","How does a Decision differ from a Regulation?",["Binding only on those to whom addressed","Not binding","Needs implementation","Identical"],0,"Regulations apply in all Member States; Directives require implementation into domestic law."],["EU Law","Which EU measures are not enforceable?",["Opinions, Recommendations, Resolutions, Declarations","Directives","Regulations","Decisions"],0,"They can still guide courts on the purpose of Community law."],["EU Law","What is the effect of an ECJ judgment?",["Binds only the parties; no stare decisis","Binds all courts","Is advisory only","Binds the Commission only"],0,"ECJ decisions are nonetheless important reference points."],["EU Law","What are the Commission's divisions called?",["Directorates","Chambers","Cabinets","Houses"],0,"E.g. Directorate of the Internal Market, and of Justice and Social Affairs."],["Classification","Which is public law?",["Constitutional law","Contract law","Tort","Succession"],0,"Public law: local government, constitutional, criminal. It regulates the state vs private citizen."],["Beyond the Notes","Beyond the notes: What are the three components of the Oireachtas?",["President, Dáil, Seanad","Taoiseach, Cabinet, Courts","Dáil, Commission, Council","President, Supreme Court, Dáil"],0,"Article 15 of the Constitution vests sole law-making power in the Oireachtas."],["Beyond the Notes","Beyond the notes: What is a statutory instrument (SI)?",["Secondary legislation made under powers from an Act","A court order","EU treaty","A custom"],0,"Delegated legislation is subordinate to the parent Act."],["Beyond the Notes","Beyond the notes: What is the civil standard of proof?",["Balance of probabilities","Beyond reasonable doubt","Absolute certainty","Reasonable suspicion"],0,"Criminal cases require proof beyond reasonable doubt."],["Beyond the Notes","Beyond the notes: Which case established the 'neighbour principle' in negligence?",["Donoghue v Stevenson","Francovich","High Trees","Foyle Fisheries"],0,"It founded the modern duty of care: take reasonable care not to injure persons closely affected by your acts."],["Beyond the Notes","Beyond the notes: Maximum GDPR fine?",["€20 million or 4% of worldwide turnover, whichever is higher","€1,000","€1 million","No fine"],0,"This is the upper tier; lower tier is €10m or 2%."],["Beyond the Notes","Beyond the notes: How long does EU copyright generally last?",["Life of author + 70 years","20 years","5 years","Perpetual"],0,"Patents last up to 20 years; trademarks are renewable."],["Beyond the Notes","Beyond the notes: Which principle makes EU law override conflicting national law?",["Primacy (Costa v ENEL)","Lenity","Mischief","Tithing"],0,"Ireland accepted this on joining the EEC in 1973."],["Beyond the Notes","Beyond the notes: How was Bunreacht na hÉireann adopted?",["By plebiscite of the people in 1937","By the King","By Westminster","By the ECJ"],0,"It replaced the 1922 Free State Constitution."],["Beyond the Notes","Beyond the notes: In Carlill v Carbolic Smoke Ball, the advertisement was:",["A unilateral offer to the world accepted by performance","Mere puff","An invitation to treat","A tort"],0,"It is a leading authority on offer and acceptance."],["Beyond the Notes","Beyond the notes: Under Article 26, who can refer a Bill to the Supreme Court?",["The President","The Taoiseach","Any citizen","The ECJ"],0,"This tests constitutionality before signing; a Bill upheld cannot later be challenged."],["Precedent & Interpretation","'Expressio unius est exclusio alterius' means:",["Words take meaning from their neighbours","Naming one thing excludes others (where the list isn't just examples)","Criminal statutes are read narrowly","General words are limited to things of the same kind"],1,"Applies only where the list is not just illustrative."],["Precedent & Interpretation","Under the literal approach, a judge applies:",["The spirit of EU law","The majority view in the US","The plain ordinary meaning, even if the result is absurd or harsh","The mischief Parliament wanted to fix"],2,"Golden rule: plain meaning unless absurd. Purposive: follows the law's purpose."],["Precedent & Interpretation","The mischief rule asks the court to:",["Follow the ECJ","Look behind the words to the problem Parliament wanted to fix","Read the statute narrowly","Apply the plain words regardless"],1,"The 'mischief' is the problem the statute was meant to remedy."],["Irish Courts","Which court has jurisdiction for unlimited amounts in civil claims?",["The High Court","Special Criminal Court","Circuit Court","District Court"],0,"Circuit Court: up to €75,000. District Court: up to €15,000."],["Irish Courts","The Court of Appeal consists of:",["Three judges, no jury","A single judge","The President plus 9 judges","Chief Justice plus 9 judges"],2,"The Supreme Court has the Chief Justice plus 9 judges."]]},{"k":"eth","q":[["Intro & Key Terms","What is the 'ethical point of view'?",["Respecting other people and their core values","Considering only your own core values","Obeying whatever the law says","Following majority opinion"],0,"The slides contrast two ways to view the world: the selfish point of view (only your own core values) and the ethical point of view (respecting others and their core values). Core values shared by virtually everyone: life, happiness and the ability to accomplish goals."],["Intro & Key Terms","Which are the 'core values' virtually everybody shares?",["Life, happiness, ability to accomplish goals","Wealth, fame, power","Obedience, tradition, duty","Honesty, loyalty, courage"],0,"These three are the shared basis the slides use to argue that moral guidelines are not purely arbitrary."],["Intro & Key Terms","How do the slides define 'society'?",["An association of people organised under a system of rules that advance the good of members over time","Any group living in one country","A government and its courts","A group sharing one religion"],0,"Society = people under a system of rules. Those rules aim to advance members' good over time."],["Intro & Key Terms","Which pairing of terms is correct?",["Morality = a society's rules of conduct; Ethics = rational examination of morality","Morality = rational examination; Ethics = society's rules","Both mean the law","Both mean personal feelings"],0,"Morality is the set of rules (what people ought/ought not do, e.g. on conscription). Ethics is the rational examination of that morality and the evaluation of behaviour."],["Intro & Key Terms","Why do we need ethics, according to the slides?",["Not everyone can do what they want, and new technologies bring new problems","Because laws are always perfect","To avoid all disagreement","Because religion demands it"],0,"Ethics offers a way to decide the best thing to do. New technology creates new problems (e.g. email vs SPAM, libraries vs web ads), and 'common wisdom' is not always adequate."],["Intro & Key Terms","What does 'doing ethics' require?",["Answers that come with explanations based on facts, shared values and logic","Gut feelings only","A vote","A holy book"],0,"Ethics is rational, systematic analysis: answers need explanations built from facts, shared values and logic."],["Intro & Key Terms","What is a 'workable ethical theory'?",["One that produces explanations that might persuade a sceptical yet open-minded audience","One that is easy to apply","One everyone already agrees with","One backed by law"],0,"The slides test every theory against this standard, then declare each theory workable or not."],["Intro & Key Terms","The trolley-car scenarios (switch vs. pushing the man off the bridge) are used to:",["Probe moral intuitions and compare ethical theories","Teach traffic law","Prove utilitarianism","Test Kant's rules"],0,"Scenario 1 (flip a switch, one dies, five saved) and Scenario 2 (push a man to stop the trolley) test whether killing and letting die differ, and what each theory says. They reappear in the driverless cars discussion."],["Intro & Key Terms","Socrates (470–399 BC) is notable because he:",["Left no writings, yet influenced Plato and Aquinas","Wrote Leviathan","Founded utilitarianism","Taught Kant"],0,"Socrates wrote nothing; we know him through others such as Plato."],["Intro & Key Terms","Epicurus (341–270 BC) is described as:",["A materialist; hedonism based on pleasure and pain; death should not be feared","A divine command theorist","An egoist who rejected pleasure","A social contract thinker"],0,"His hedonism (pleasure/pain) is an ancestor of Bentham and Mill's utilitarianism."],["Relativism","What does relativism claim?",["There are no universal norms of right and wrong","Morality is fixed for all","Only God defines right","Only laws define right"],0,"Under relativism one person can say 'X is right' and another 'X is wrong' and both can be right."],["Relativism","Subjective relativism says:",["Each person decides right and wrong for themselves","Each society decides","God decides","Reason decides"],0,"'What's right for you may not be right for me.'"],["Relativism","A 'case for' subjective relativism is that:",["Well-meaning, intelligent people disagree on moral issues, and moral debates seem pointless","It is supported by science","It matches the law","It gives clear rules"],0,"Those are the two arguments in its favour."],["Relativism","Which is a 'case against' subjective relativism?",["It blurs the line between doing what you think is right and doing what you want","It is too strict","It requires a holy book","It is too hard to apply to groups"],0,"It also makes no moral distinction between people's actions (the slides compare Hitler and Mother Teresa)."],["Relativism","Why is 'I can do what I want as long as I don't harm others' a problem for the subjective relativist?",["It needs an agreed meaning of harm and acts as a universal rule, so it is inconsistent","It is too permissive","It is illegal","It is a religious rule"],0,"SR says there are no universal rules, yet 'don't harm others' is one. We would also have to agree what 'harm' means."],["Relativism","Why does equating subjective relativism with tolerance fail?",["Tolerance is a universal rule ('people ought to be tolerant'), but SR denies universal rules","Tolerance is harmful","SR is always tolerant","Tolerance is illegal"],0,"Tolerance is vital to a pluralistic society, but it is a different thing from SR; SR cannot even say people ought to be tolerant."],["Relativism","Why is subjective relativism not a workable theory?",["It would not persuade others in justification; decisions may not rest on reason (e.g. dice)","It is too complex","It is too old","It is religious"],0,"The slides note decisions might be made by Torah cards or dice rolling, which gives no reasoned justification."],["Relativism","In the slides' car-accident dilemma, what is at stake?",["Duty to a friend vs. obligations of a sworn witness","Speeding fines","Insurance","Lawyer fees"],0,"A friend hit a pedestrian going 35 mph in a 20 zone; his lawyer asks you to testify he went 20. The Hampden-Turner/Trompenaars study put this dilemma to people in 46 countries and found answers differ by culture."],["Relativism","Cultural relativism says right and wrong depend on:",["A society's actual moral guidelines, which vary by place and time","Each individual","God","Universal reason"],0,"Anthropologists identify 'folkways'; a group's morality is the sum of its taboos and prescriptions."],["Relativism","Which is an argument FOR cultural relativism?",["It is arrogant for one society to judge another, e.g. judging someone in the 15th century","It gives universal rules","It always agrees with law","It rejects all tolerance"],0,"Also: different social contexts (survival vs mass production, pollution, common fisheries) demand different guidelines, and morality is reflected in actual behaviour ('do as I say, not as I do')."],["Relativism","'Because two societies hold different moral views, they ought to hold different views' is:",["A flawed inference (different views don't make both right)","Valid","Proven by anthropology","A Kantian rule"],0,"The slides' example: drought, build an aqueduct vs human sacrifice. Disagreement doesn't make both answers right."],["Relativism","The 'many/any fallacy' means:",["Because many practices are acceptable, it does not follow that any practice is acceptable","Many people means any person","Any rule is many rules","Many laws are acceptable"],0,"Cultural relativism can slide from 'many cultural practices are fine' to 'any practice is fine'."],["Relativism","Which example shows cultural relativism cannot explain moral change?",["Rosa Parks and US university integration in the 1960s: legally wrong but morally right","The Ten Commandments","The Trolley problem","Hobbes's Leviathan"],0,"It doesn't explain how moral guidelines evolve, or how they are set for new technologies (e.g. 'are downloads always right?'). It also offers no way out for cultures in conflict (the Gaza conflict example)."],["Relativism","Which core values do societies share to survive, per the slides?",["Caring for newborns, telling the truth, prohibition of murder","Worship, sacrifice, obedience","Wealth, trade, tax","Dress, language, diet"],0,"This shared core is a possible basis for a universal value system, against cultural relativism."],["Divine Command","Divine command theory holds that good actions are those:",["Aligned with God's will, as revealed in holy books","Producing most happiness","Passing the universal-law test","Agreed by a contract"],0,"Bad actions are contrary to God's will; holy books are the guide. The slides use Leviticus 19 as an example text."],["Divine Command","Which is a 'case FOR' divine command theory?",["We owe obedience to our Creator; God is all-good, all-knowing and the ultimate authority","It is easy to prove","It applies in secular societies","All holy books agree"],0,"The case rests on God's authority and goodness."],["Divine Command","Why do different holy books create a problem for DCT?",["They disagree (even Christian Old Testament canons differ), in a multicultural, multi-faith, secular society","They are too long","They are all the same","They are illegal"],0,"Also, some modern moral problems aren't addressed in scripture; analogy is needed, but 'whose analogy?'"],["Divine Command","What is the 'Plato' (Euthyphro) objection?",["Are things pious because the gods love them, or do the gods love them because they are pious?","Gods do not exist","Piety is pleasure","Gods obey laws"],0,"The slides: the gods love piety because it is pious, not pious because they love it. So 'good' is an objective standard; otherwise it becomes arbitrary ('commit or not commit adultery?')."],["Divine Command","'The good' ≠ 'God' is flagged as:",["An equivalence fallacy to avoid","A Kantian principle","A utilitarian rule","A relativist claim"],0,"Equating goodness with God's command ignores that good can be discussed independently, if it is an objective good."],["Divine Command","Why is DCT not a workable ethical theory?",["It is based on obedience, not reason","It has no rules","It is too liberal","It was never written down"],0,"The Abraham and Isaac story illustrates obeying a command even when it seems to clash with reason or morality."],["Ethical Egoism","Ethical egoism states that the right action is the one that:",["Gives you the maximum long-term benefit","Gives everyone equal benefit","Follows God's will","Is legal"],0,"Each person should focus exclusively on their own self-interest, the contrast with 'love your neighbour as yourself'."],["Ethical Egoism","Does ethical egoism prohibit helping others?",["No, helping is right if and only if it is in the helper's own long-term interest","Yes, always","Only for family","Only strangers"],0,"Egoism is not 'never help'; help is justified by the helper's long-term benefit."],["Ethical Egoism","A 'case for' ethical egoism:",["It is practical, communities can benefit (e.g. entrepreneurs create jobs), and other principles (promise-keeping) are rooted in self-interest","It is ancient","It is Kant's idea","It has no counterexamples"],0,"Also: we can't know what's good for others, a 'good deed' can harm, and dependence on charity can cost self-esteem."],["Ethical Egoism","Which is a case AGAINST ethical egoism?",["Self-interest can produce blatantly immoral behaviour; we do know much about what's good for others","It is too altruistic","It conflicts with economics","It is too hard to apply"],0,"Charity doesn't always create dependence (e.g. a scholarship); people who consider others live happier lives, and happiness spreads through close relationships."],["Ethical Egoism","The drowning-person example shows:",["EE would save a life only if it serves self-interest (e.g. publicity), though a human life's value should decide","EE always saves life","EE forbids rescue","Wet shirtsleeves matter morally"],0,"The cost is only one wet sleeve, yet EE bases the decision on self-interest, not the value of a human life."],["Ethical Egoism","Why does the slide conclude we reject ethical egoism?",["It ignores that to reap the benefits of community, individuals must consider others' good","It is illegal","It is unpopular","It is old"],0,"It is not a workable ethical theory."],["Kantianism","Which philosopher is associated with the 'good will'?",["Immanuel Kant","Bentham","Hobbes","Rawls"],0,"Kant asked what is good without qualification; not intelligence, strength or courage, only a good will, even if the result isn't achieved."],["Kantianism","Kant's ethics is described as:",["Deontological (duty-based)","Consequentialist","Relativist","Egoist"],0,"The moral value of an action depends on the underlying moral rule, not its consequences."],["Kantianism","First formulation of the Categorical Imperative:",["Act only from moral rules you can at the same time will to be universal laws","Act to maximise happiness","Obey God","Never lie"],0,"Test: universalise your rule; if it contradicts itself, the rule is flawed."],["Kantianism","Why is a false promise to escape trouble wrong under the 1st formulation?",["If everyone did it, promises would be unbelievable, contradicting the wish to be believed","It is illegal","It hurts feelings","God forbids it"],0,"The universalised rule is self-defeating: a contradiction, so the answer to 'may I?' is no."],["Kantianism","Second formulation of the Categorical Imperative:",["Treat yourself and others as ends in themselves, never only as a means","Maximise utility","Obey the contract","Follow the majority"],0,"Usually easier to apply than the first. Example prompt: hiring for a plant that will close in a year."],["Kantianism","In the plagiarism scenario (Mary), why is buying a report wrong by the 1st formulation?",["Universalised, reports would no longer be credible and lecturers would not give credit","She might be caught","It hurts the seller","It breaks college policy only"],0,"The rule 'claim credit for work done by someone else' is self-defeating."],["Kantianism","By the 2nd formulation, Mary's plagiarism is wrong because:",["She deceived the lecturer, treating them as a means to passing the course","She was tired","Her grades were already good","She paid money"],0,"The focus is on the will behind the act: passing the course (end) via the lecturer issuing a grade (means)."],["Kantianism","A case FOR Kantianism:",["It is rational, universal, treats all persons as moral equals and combats discrimination","It is simple to compute","It handles every conflict","It ignores duty"],0,"E.g. human sacrifice was always wrong. It can produce a 'why' for a rule."],["Kantianism","A case AGAINST Kantianism:",["No single rule may characterise an action (e.g. stealing for a starving family), and rule conflicts are hard to resolve","It ignores rules","It's utilitarian","It's relativist"],0,"Kant distinguished perfect duties (don't steal, don't lie) from imperfect duties (help others, develop talents). Perfect duties prevail, but conflicts between perfect duties remain."],["Utilitarianism","Who founded utilitarianism?",["Jeremy Bentham and John Stuart Mill","Kant and Hobbes","Locke and Rawls","Plato and Socrates"],0,"An action is good if it benefits someone and bad if it harms someone."],["Utilitarianism","'Utility' is defined as:",["An object's tendency to produce happiness or prevent unhappiness","Usefulness in business","Money","Legal permission"],0,"Happiness = advantage = benefit = good = pleasure; unhappiness = disadvantage = cost = evil = pain."],["Utilitarianism","The Principle of Utility (Greatest Happiness Principle) says an action is right:",["To the extent it increases total happiness of affected parties","If done from duty","If God wills it","If rational people agree"],0,"It's a consequentialist theory: intent is irrelevant; consequences matter."],["Utilitarianism","Which is NOT one of Bentham's seven factors?",["Legality","Intensity","Fecundity","Propinquity"],0,"Seven: intensity, duration, certainty, propinquity (nearness), fecundity (producing more of the same), purity (not diluted by pain), extent (number affected)."],["Utilitarianism","In the road re-routing scenario, why was the road deemed good?",["Benefits (€39m savings) exceeded costs (€31m: €20m + €10m + €1m)","It saved wildlife","It was legal","It was a duty"],0,"30,000 cars × 20c/day over 25 years ≈ €39m. Act utilitarianism: sum > 0 means the action is good."],["Utilitarianism","Act utilitarianism evaluates:",["Each individual action by total change in happiness","Rules adopted by everyone","Intent","Rights"],0,"If the sum of changes for all affected is > 0 the action is good, < 0 it's bad."],["Utilitarianism","A case FOR act utilitarianism:",["Focuses on happiness, practical, comprehensive, helps groups reach collective decisions","Respects every promise","Ignores consequences","Is easy to compute for every case"],0,"Method: list alternatives, total the anticipated positives and negatives, pick the maximum."],["Utilitarianism","Which is a case AGAINST act utilitarianism?",["Unclear whom to include, too much work per decision, ignores duty, moral luck","It ignores happiness","It's too simple","It's religious"],0,"E.g. keep a promise or not; 1000 units for A vs 1001 for B. Moral luck: actions not having the intended consequence."],["Utilitarianism","Rule utilitarianism applies the Principle of Utility to:",["Moral rules","Individual acts","Intentions","Governments"],0,"We should adopt rules that, if followed by everyone, lead to the greatest increase in total happiness."],["Utilitarianism","In the Nachi anti-worm scenario, rule utilitarianism concludes releasing it is:",["Wrong: harm outweighs benefits","Right","Neutral","Illegal only"],0,"Benefits: people who don't update. Harms: network users, victims of buggy anti-worms, sysadmins. Nachi removed Blaster but also attacked other PCs."],["Utilitarianism","A case FOR rule utilitarianism:",["Easier calculation, rules survive exceptional situations (W.D. Ross), avoids moral luck","It is act utilitarianism","It ignores rules","It rejects happiness"],0,"The long-term benefit of keeping promises stands. The slides call it workable."],["Utilitarianism","A criticism of utilitarianism in general:",["All consequences must be measured on a single scale, and distribution may be unjust","It ignores consequences","It requires God","It has no calculus"],0,"It must quantify, e.g., a human life or '10 divorces'. 'Greatest good of the greatest number' needs a separate Principle of Justice, which can conflict with Utility."],["Social Contract & Rights","Hobbes (Leviathan, 1651-era) described life without rules as:",["Solitary, poor, nasty, brutish and short","Free and happy","Peaceful","Equal"],0,"Hobbes (1603–1679): in a state of nature nobody would create anything of value. Rational people implicitly accept a social contract."],["Social Contract & Rights","Rousseau's social contract: the critical problem is:",["Finding an association that guarantees safety yet leaves each person free","Taxation","Property","War"],0,"The answer: everyone gives themselves and their rights to the whole community, which sets rules all must obey. In an ideal society no one is above the rules."],["Social Contract & Rights","James Rachels's definition of morality:",["Rules governing how people treat each other that rational people accept for mutual benefit, if others follow them too","God's commands","Maximising happiness","Duty alone"],0,"It captures the 'rational agreement for mutual benefit with reciprocity' idea."],["Social Contract & Rights","How do Social Contract Theory and Kantianism compare?",["Both use universal norms from a rational process, but differ on how a rule is judged ethical","Both are consequentialist","Both reject reason","Both are relativist"],0,"SCT: right to follow a rule if rational people would collectively accept it as binding for its community benefits."],["Social Contract & Rights","A negative right is:",["A right others guarantee by leaving you alone","A right requiring others to act for you","A right that doesn't exist","A limited right"],0,"A positive right obligates others to do something for you. Negative rights tend to be absolute; positive rights tend to be more limited."],["Social Contract & Rights","Which pair is correct?",["Absolute right: guaranteed without exception; limited right: may be restricted by circumstances","Absolute = positive always","Limited = negative always","They mean the same"],0,"The correlation: positive rights tend to be limited; negative rights tend to be absolute."],["Social Contract & Rights","Rawls's difference principle says inequalities must:",["Benefit the least-advantaged most and attach to positions open to all with fair opportunity","Be abolished","Favour the majority","Favour the productive"],0,"Plus each person may claim a fully adequate number of basic rights and liberties compatible with others' equal claim."],["Social Contract & Rights","Which view fits Rousseau's quote 'the social state is advantageous only when all possess something and none has too much'?",["Social contract theory recognises the harm of concentrated wealth and power","Utilitarianism","Egoism","Relativism"],0,"By contrast the utilitarian standpoint may allow an unequal distribution with more total utility over an equal one with less."],["Social Contract & Rights","A case AGAINST social contract theory:",["No one signed the contract; conflicting rights (e.g. abortion); may unjustly treat those who cannot uphold it","It ignores rights","It is too individualist","It is unreasoned"],0,"E.g. people who can't bear the burdens, such as drug addicts; society tries to distinguish those who choose to break rules from those who cannot help it."],["Scenarios & Applications","In the DVD rental scenario, selling customer profiles was wrong under social contract theory if:",["Customers have a right to confidentiality without giving permission","Bill owns all the data","Customers like catalogues","Profiles are public"],0,"If Bill and the customer have equal rights to the information, Bill did nothing wrong; if the customer has a right to confidentiality, selling without permission was wrong."],["Scenarios & Applications","Objectivism vs relativism:",["Objectivism: morality exists outside the human mind; relativism: morality is a human invention","The reverse","Both are religious","Both reject reason"],0,"Kantianism, utilitarianism and social contract theory are examples of objectivism."],["Scenarios & Applications","Morality of copying a CD collection: which view says it's wrong because people shouldn't choose selfish interest over common good?",["Social contract theory","Act utilitarianism","Subjective relativism","Egoism"],0,"Kantian and rule utilitarian views also say obeying the law's benefit outweighs the gain; act utilitarianism has the potential to justify copying."],["Scenarios & Applications","Legal principle quoted in the driverless-cars discussion:",["Nullum crimen sine lege ('no crime without law')","Stare decisis","Mens rea","Habeas corpus"],0,"The slides note ethics and law often diverge; slavishly following the law might be foolish and dangerous, and we can build a legal framework informed by ethics."],["Scenarios & Applications","Driverless cars: which question relates to the trolley problem?",["Is there a moral distinction between 'killing' and 'letting die', and who's life to protect?","What colour to paint them","Which fuel to use","How loud the horn is"],0,"Programmers must ultimately pre-programme decisions, so trolley scenarios are a starting point; premeditated vs reflexive decisions also matter."],["Scenarios & Applications","Another driverless-car concern in the slides:",["Hacking, privacy, gaming of the crash-avoidance system, and too-conservative driving causing road rage","Tyre wear","Paint costs","Radio"],0,"Also insurance, mega-crashes, ownership (public vs private), and abuses like drink driving. Safer record overall, yet machines may need a stricter test than a teenager's standard."],["Beyond the Notes","Which ethical theory bases right action on duty and the will, not consequences?",["Kantianism","Act utilitarianism","Egoism","Cultural relativism"],0,"Beyond the notes: Kant's focus on motive/duty contrasts with consequentialism."],["Beyond the Notes","'The ends justify the means' is most associated with:",["Consequentialism, such as act utilitarianism","Kantianism","Divine command","Social contract"],0,"Kant's second formulation forbids treating people merely as means."],["Beyond the Notes","Which philosopher wrote 'On Liberty' and refined utilitarianism with 'higher' and 'lower' pleasures?",["J.S. Mill","Kant","Hobbes","Epicurus"],0,"Mill argued intellectual pleasures are of higher quality than bodily ones: 'better to be Socrates dissatisfied than a fool satisfied'."],["Beyond the Notes","Which philosopher created the 'veil of ignorance'?",["John Rawls","Hobbes","Plato","Bentham"],0,"Rawls: choose principles of justice without knowing your place in society, which supports the difference principle."],["Beyond the Notes","Virtue ethics (Aristotle) focuses on:",["Character and virtues rather than rules or consequences","Maximum pleasure","Universal laws","Contracts"],0,"A fourth major tradition not in the slides; it asks 'what kind of person should I be?'"],["Beyond the Notes","Whistleblowing in IT (e.g. exposing unsafe software) is best analysed using:",["Any of the workable theories, comparing their conclusions","Law only","Gut feeling","Company policy"],0,"Applying Kant, utilitarianism and SCT to real cases is exactly the method of the course."],["Beyond the Notes","A utilitarian who would lie to save many lives is judged by a Kantian as:",["Acting wrongly, since lying violates a perfect duty","Acting rightly","Neutral","Legal"],0,"Perfect duties like not lying allow no exceptions under Kantianism."],["Beyond the Notes","The 'trolley problem' was first introduced by:",["Philippa Foot","Kant","Mill","Rousseau"],0,"Foot (1967) posed it; Judith Jarvis Thomson later added the footbridge variant."],["Beyond the Notes","GDPR-style data protection rights are best described as:",["Positive and negative rights (e.g. right to be left alone and to access data)","Only relativist","Only divine","Only egoist"],0,"Connects the DVD scenario to current law."],["Beyond the Notes","The 'tragedy of the commons' (shared fisheries) most clearly illustrates:",["Individual self-interest harming the common good","Perfect duties","Divine will","Cultural taboo"],0,"A challenge to ethical egoism, a reason for social contract rules."],["Intro & Key Terms","Which examples of new problems from new technology do the slides give?",["Email vs SPAM; libraries vs WWW ads","Cars vs horses","Radio vs TV","Phones vs letters"],0,"They show that technology creates fresh moral problems that 'common wisdom' may not cover."],["Intro & Key Terms","The slides' example of a morality question about a society's rules is:",["Conscription (what ought people to do?)","Tax rates","Speed cameras","Voting age"],0,"Morality = what people ought/ought not do in various situations, e.g. competition and conscription."],["Intro & Key Terms","Ethics is described as involving which kind of choices?",["Voluntary, moral choices","Forced choices","Random choices","Legal choices only"],0,"Ethics = rational, systematic analysis of voluntary moral choices; answers need explanations."],["Intro & Key Terms","What 'two ways to view the world' do the slides name?",["Selfish point of view and ethical point of view","Religious and secular","Legal and illegal","Old and new"],0,"Selfish: only your own self and core values. Ethical: respect other people and their core values."],["Intro & Key Terms","In trolley Scenario 1, who tied the five people to the track?",["A mad philosopher","A train driver","The government","A criminal gang"],0,"You can flip a switch to divert the trolley onto a track where one person is tied."],["Intro & Key Terms","In trolley Scenario 2, how can you stop the trolley?",["Push a very fat man off the bridge onto the track","Flip a switch","Shout a warning","Pull a brake"],0,"You are on a bridge; the only way to stop it is to push him, killing him to save five. Compare with Scenario 1: most feel pushing is worse, though the numbers are the same."],["Relativism","Subjective relativism: what does 'both can be right' mean?",["One person says X is right, another says X is wrong, and both are correct","Both are wrong","Only the majority is right","Neither can be judged"],0,"With no universal norms, contradictory moral claims can both be true for those who hold them."],["Relativism","Why do the slides say SR 'makes no moral distinction between different people's actions'?",["Because every person's own view is right for them, e.g. Hitler vs Mother Teresa","Because it is based on law","Because it uses utility","Because it is religious"],0,"If each person defines their own morality, we cannot criticise any action."],["Relativism","Which words describe the debates SR supporters find 'disagreeable and pointless'?",["Ethical debates","Legal debates","Scientific debates","Economic debates"],0,"This is part of the case for SR, together with disagreement between well-meaning, intelligent people."],["Relativism","Cultural relativism: 'morality is reflected in actual behaviour' is summed up as:",["'Do as I say, not as I do'","'Love thy neighbour'","'Might is right'","'Know thyself'"],0,"It is used in the case FOR CR: what a society actually does reveals its morality, not what it preaches."],["Relativism","As humans moved 'from survival to mass production', what new moral issues appeared, per the slides?",["Pollution and common fisheries","Marriage customs","Language death","War rules"],0,"Different social contexts demand different moral guidelines."],["Relativism","Why does cultural relativism 'provide no way out for cultures in conflict'?",["If each culture is right by its own norms, there is no neutral standard to settle disputes (e.g. Gaza)","Because cultures never conflict","Because law solves it","Because it is universal"],0,"Also, it can't explain how moral guidelines are decided for new technologies."],["Relativism","Cultural relativism is 'only indirectly based on reason'. What does the slide conclude?",["It is not a workable ethical theory","It is workable","It is the best theory","It is Kantian"],0,"Subjective relativism is also declared not workable."],["Relativism","In the driving dilemma, which answer options exist for the first question?",["A: definite right, B: some right, C: no right to expect you to protect him","Yes/No only","Guilty/Not guilty","True/False"],0,"The second asks what you would do: Y (testify he went 20) or N (not). The study compared answers across 46 countries."],["Divine Command","Which Old Testament text do the slides quote for rules of conduct?",["Leviticus chapter 19","Genesis 1","Psalm 23","Job 3"],0,"It includes: don't steal, don't deceive, don't withhold a labourer's wages overnight, leave gleanings for the poor and the alien, and love your neighbour as yourself."],["Divine Command","Which three great monotheist religions emerged from the Middle East (Torah)?",["Judaism, Christianity, Islam","Hinduism, Buddhism, Sikhism","Taoism, Shinto, Jainism","Zoroastrianism, Judaism, Confucianism"],0,"They give the context for DCT: holy books as guides to God's will."],["Divine Command","What is the 'equivalence fallacy' in DCT?",["Treating 'the good' as identical to 'God'","Treating law as morality","Treating pleasure as good","Treating rules as duties"],0,"If good just means God's command, then good becomes arbitrary."],["Divine Command","Why is 'thou shalt not commit (or commit) adultery' used in the notes?",["If good were just God's command, it could just as well have commanded the opposite: arbitrary","It is a legal rule","It shows Kant's duty","It shows utilitarian harm"],0,"The Euthyphro point: good must be an objective standard, not an arbitrary command."],["Divine Command","The story of Abraham and Isaac illustrates DCT as:",["A case where obedience to a command is placed above reason","A utilitarian calculation","A social contract","A relativist claim"],0,"The slides conclude DCT is based on obedience, not reason."],["Ethical Egoism","Ethical egoism is contrasted with which principle?",["'Love your neighbour as yourself'","'Know thyself'","'An eye for an eye'","'Do no harm'"],0,"EE says each person should focus exclusively on their own self-interest."],["Ethical Egoism","What does the slide say about charity and self-esteem (case FOR EE)?",["Dependence on others' charity can lead to loss of self-esteem","Charity always raises esteem","Charity is a duty","Charity is illegal"],0,"Case FOR also says we can't know for sure what's good for others and a good deed can bring more harm than good."],["Ethical Egoism","Which example do the slides use of an egoist's benefit to others?",["Successful entrepreneurs getting rich but creating jobs and wealth","Doctors saving lives","Teachers earning pensions","Soldiers winning wars"],0,"Case FOR EE: the community can benefit when individuals put their well-being first."],["Ethical Egoism","Why are promise-breaking and lying 'a bad idea' even for an egoist?",["Long-term consequences harm your own interests","God forbids it","They are illegal","They are universal"],0,"Other moral principles can be rooted in self-interest, deduced from long-term consequences."],["Ethical Egoism","What does the 'easy philosophy' objection to EE say?",["An easy moral philosophy may not be the best one; people struggle to resist short-term pleasure against long-term benefit","Egoism is hard","Egoism is too altruistic","Egoism has no followers"],0,"Self-interest does not guarantee the long-term benefit it promises."],["Ethical Egoism","What do the 'studies' cited against EE show?",["Happiness spreads through close relationships: family, friends and neighbours","Wealth spreads","Crime spreads","Charity decreases"],0,"People who take others' good into account live happier lives."],["Kantianism","Kant asks: what is 'always good without qualification'? Which options does he reject?",["Intelligence, strength and courage","Good will","Duty","Reason"],0,"They can be used for bad ends; only a good will is good without qualification, even if the result isn't achieved."],["Kantianism","According to Kant what should reason cultivate?",["The desire to do the right thing, not what we'd like to do","The desire for pleasure","The desire for wealth","The desire for fame"],0,"Dutifulness: our will should be grounded in a conception of moral rules."],["Kantianism","The 'critical' question Kantians face after saying moral value depends on the rule is:",["What makes a moral rule appropriate?","Who made the rule?","Is it legal?","Is it popular?"],0,"The Categorical Imperative's formulations answer this."],["Kantianism","Kant's 'hiring for a plant that will close down in a year' example illustrates which formulation?",["The second: treating people as ends, never merely as means","The first","Rule utilitarianism","Rawls's principle"],0,"Hiring workers without telling them would use them as mere means."],["Kantianism","Who is Mary in the plagiarism scenario?",["A single mother working full time and taking two evening courses per semester, with an 'A' record","A lecturer","A student with no job","A librarian"],0,"The final report in a history class takes more work than normal; she buys one and submits it as her own."],["Kantianism","Why is Kantianism 'workable', despite problems?",["It gives rational, universal, fair guidance, so remains workable for our purposes","It solves every conflict","It has no critics","It is based on law"],0,"The slides accept weaknesses (rule characterisation, conflicts between perfect duties, the 'hair' problem) but still call it workable."],["Kantianism","What does 'Depends on characterising the proposed rule properly' warn?",["The result of the universalisation test can change with how the rule is described","Rules never matter","Only laws count","Duties never conflict"],0,"E.g. stealing to feed a starving family could be described several ways."],["Utilitarianism","Utilitarianism is described as 'consequentialist'. What does that mean?",["Morality depends on outcomes, not intent","Morality depends on duty","Morality depends on God","Morality depends on contract"],0,"The morality of an action has nothing to do with intent."],["Utilitarianism","Bentham's 'propinquity' means:",["How close the experience is in space and time","How long it lasts","How many are affected",
