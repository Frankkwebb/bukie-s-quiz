"How pure it is"],0,"Intensity = magnitude; duration; certainty = probability; fecundity = producing more of the same; purity = not diluted by pain; extent = number of beings."],["Utilitarianism","Bentham's 'fecundity' means:",["The ability to produce more of the same experiences","Closeness","Duration","Probability"],0,"A pleasure that leads to further pleasures scores higher."],["Utilitarianism","In the road scenario, how many houses would be removed and how much shorter is the road?",["150 houses; 1 mile shorter","15 houses; 10 miles","1500 houses; 2 miles","50 houses; 1 mile"],0,"Costs: €20m compensation, €10m construction, €1m wildlife. Benefits: €39m savings."],["Utilitarianism","A weakness of act utilitarianism highlighted in the highway case:",["Unclear whom to include: congestion elsewhere, broken communities","It ignores money","It is too short","It requires God"],0,"It also takes too much work per decision."],["Utilitarianism","'Moral luck' means:",["Actions sometimes don't have the intended consequences, yet are judged by outcomes","Luck is moral","People are lucky to be moral","Gambling is immoral"],0,"Act utilitarianism is susceptible to it; rule utilitarianism avoids it."],["Utilitarianism","'1000 units of good for A vs 1001 for B' is used to show:",["Act utilitarianism could override duty for a tiny difference","Utilitarianism is fair","Rights matter","Kant is wrong"],0,"It ignores our innate sense of duty, e.g. keeping a promise vs not."],["Utilitarianism","What happened in August 2003 in the anti-worm scenario?",["The Blaster worm infected thousands of Windows computers, followed by Nachi","Mydoom spread","Y2K","ILOVEYOU"],0,"Nachi destroyed Blaster copies and downloaded a patch, but also used PCs to infect others."],["Utilitarianism","Who benefits from the anti-worm in the rule-utilitarian analysis?",["People who do not keep their systems updated","Sysadmins","Network users","Hackers"],0,"Harmed: network users, owners of computers invaded by buggy anti-worms, system administrators."],["Utilitarianism","Which phrase does NOT mean the Principle of Utility?",["Principle of Justice","Greatest Happiness Principle","Principle of Utility","Bentham-Mill principle"],0,"Justice is a separate principle; utility alone does not mean 'greatest good of the greatest number'."],["Social Contract & Rights","Hobbes's 'Leviathan' is associated with which date range for the author?",["1603–1679","1712–1778","1724–1804","1806–1873"],0,"Rousseau lived 1712–1778."],["Social Contract & Rights","What does the social contract establish?",["Moral rules governing citizens' relations, and a government able to enforce them","A religion","A market","A army"],0,"We implicitly accept it as rational people who need rules for meaningful cooperation."],["Social Contract & Rights","Which rights did Hobbes, Locke and others hold all moral beings have?",["Life, liberty and prosperity","Wealth, power, fame","Speech only","Privacy only"],0,"Rights are balanced against duties, e.g. right to life vs others' duty not to kill you."],["Social Contract & Rights","Why is not paying taxes punished under the contract?",["Being selfish and breaking the rules undermines the contract; the system includes enforcement","Taxes are divine","Taxes maximise utility","Taxes are Kantian"],0,"SCT provides for systems of laws and systems of enforcement."],["Social Contract & Rights","A case FOR SCT mentioned in the notes:",["It explains why breaking bad laws can be the right course","It forbids civil disobedience","It rejects rights","It is easy to prove"],0,"Also: framed in rights language; explains why people act in self-interest without agreement; clarifies citizen/government problems."],["Social Contract & Rights","'No one signed the contract' is:",["A criticism of SCT","A defence of SCT","A Kantian rule","A utilitarian fact"],0,"Other criticisms: actions with multiple characterisations, conflicting rights, and treating unjustly those who cannot uphold the contract."],["Scenarios & Applications","Which theories see 'obeying the law' as outweighing benefits when copying CDs?",["Kantian and rule utilitarian","Act utilitarian","Subjective relativism","Egoism"],0,"Act utilitarianism has the potential to justify copying; SCT says people shouldn't choose selfish interest over the common good."],["Scenarios & Applications","A reason why 'slavishly following the law' by autocars could be a problem:",["It might be foolish and dangerous, e.g. sometimes you need to break the speed limit","It is too safe","It is expensive","It is illegal"],0,"The slides add that autocars might need to refuse to move in some situations and that driving too conservatively can cause road rage."],["Scenarios & Applications","For autocar decision-making: 'human drivers may receive latitude' while software designers:",["May be held more accountable","Are exempt","Are praised","Are anonymous"],0,"Premeditated programming vs reflexive human reaction matters, as do factors like dog vs cow, environmental conditions and who is on board."]]},{"k":"con","q":[["Agreement","In Boyers v Duke (1905) the defendant canvas makers replied to a request for their 'lowest quotation'. What did the court hold?",["It was a binding offer","It was only a quotation of terms, not an offer","It was an acceptance","It was a counter-offer"],1,"The court held it was merely a quotation of terms on which the plaintiffs might then make an offer. Giving a price in reply to an enquiry does not make an offer."],["Agreement","Which of these is NOT one of the essentials for an agreement listed in the course?",["Offer","Acceptance","Consideration","A written document"],3,"The essentials are offer, acceptance, intention to be legally bound and consideration. Form can be written, oral or by action; only a limited number of contracts must be in writing."],["Agreement","Why was the Carbolic Smoke Ball advert in Carlill (1893) held to be an offer rather than an invitation to treat?",["It was in a newspaper","It was an offer to the world, and the £1,000 deposit showed intent to be bound","The company never denied it","Mrs Carlill was a minor"],1,"The court held the advert was an offer to the world at large, capable of acceptance by anyone who used the ball as directed. The £1,000 deposited in the bank was proof of legal intent."],["Agreement","In Partridge v Crittenden (1968), an advert offered wild birds for sale. How was it classed?",["An offer to the world","An invitation to treat","An acceptance","A unilateral contract"],1,"It was an invitation to treat: not sufficiently detailed to be an offer. Typical invitations to treat include ads, 'strawberries for sale', and goods on display with or without a price."],["Agreement","A shop shelf shows an item with the wrong (too low) price. Under the course's reasoning, who makes the offer?",["The shop, by displaying the item","The customer, who brings it to the till","Nobody; no contract is possible","The manufacturer"],1,"Displayed goods are an invitation to treat, which 'seeks offers from you'. The customer offers at the till and the shop can accept or refuse, so it need not sell at a misprinted price."],["Agreement","What did Dooley v Egan (1938) add to the rule on quotations?",["Quotes are never offers","A quote plus the words 'subject to immediate acceptance' can be an offer","A quote is always an acceptance","Offers can only be made in writing"],1,"The slides pair Boyers v Duke with Dooley v Egan: a quote on its own is not an offer, but a quote plus 'subject to immediate acceptance' = an offer."],["Agreement","An offer is marked 'subject to contract'. How do courts tend to treat this?",["Ignore it","Support the statement unless there is strong evidence to the contrary","Treat it as a binding acceptance","Void the offer"],1,"It is common in land/property deals, where parties hold off final agreement to check title or await the sale of their own property. Courts usually respect the wording."],["Acceptance","Hyde v Wrench (1840): Wrench offered land for £1,000, Hyde said £950, then tried to accept £1,000. Result?",["Valid contract at £1,000","Valid contract at £950","No contract: the counter-offer killed the original offer","Contract voidable by Hyde"],2,"A counter-offer rejects and terminates the original offer, so it can no longer be accepted. Only a mere request for information leaves the offer alive."],["Acceptance","In Butler Machine Tool v Ex-Cell-O (1979), what was the outcome of the 'battle of the forms'?",["Seller's terms won","Buyer's order was a counter-offer, accepted when the seller returned the slip","No contract formed","Court set a price"],1,"The buyer's order on its own form was a counter-offer, and the seller accepted by returning the slip. The court also stressed there are no set rules for battle-of-the-forms cases."],["Acceptance","Felthouse v Brindley (1862): 'If I hear no more about him, I consider the horse is mine.' Is there a contract?",["Yes, silence is acceptance","No, one party cannot make a contract just because the other doesn't reject it","Yes, by conduct","Only if the nephew replied"],1,"Acceptance must be clearly communicated to the offeror. Silence cannot be turned into acceptance."],["Acceptance","Parkgate Investments v Shandon Park Mills (1991) held there was no contract because:",["The price was missing","Acceptance was made to the plaintiff's solicitor and never communicated to the plaintiff","The offer had lapsed","The parties were minors"],1,"This Irish case applies the general rule that the offeror must be clearly informed of acceptance."],["Acceptance","Household Fire Insurance v Grant (1879): the acceptance letter was posted but never arrived. Was Grant bound?",["No, it never arrived","Yes, the contract was formed when the letter was posted","Only after 14 days","Only if Grant replied"],1,"The postal rule is an exception to the communication rule: acceptance takes effect on posting, even if the letter is lost."],["Acceptance","What was the key holding of Sanderson v Cunningham (1919)?",["Contract formed where the acceptance (policy) was posted: London","Contract formed in Ireland where he signed","Postal rule never applies to insurance","Contract void for mistake"],0,"Under the postal rule the acceptance (the policy) was complete in London, so the Irish court lacked the jurisdiction Sanderson wanted."],["Acceptance","The postal rule does NOT apply to:",["Letters","Instantaneous communication such as phone calls","Insurance contracts","Written offers"],1,"The slides give two exceptions to the general rule: the postal rule (not applicable to instantaneous communication) and unilateral contracts."],["Offer termination","How does an offer terminate by lapse, as in Loring v City of Boston (1844)?",["Immediately after one day","After a reasonable time: a reward claimed four years later had lapsed","Only by written withdrawal","It never lapses"],1,"The period is a matter of fact. A reward advertised and claimed four years later was held to have lapsed through passage of time."],["Offer termination","A revocation of an offer sent by post takes effect:",["When posted","Only on receipt","After 7 days","Never"],1,"Withdrawal is only possible before acceptance, and revocation by post only on receipt. This contrasts with acceptance by post, which takes effect on posting."],["Intention","Which presumption applies to agreements between businesses?",["Not legally binding unless rebutted","Legally binding unless rebutted","Always void","Voidable at either party's request"],1,"Commercial agreements are presumed to be contracts unless rebutted. Social agreements are presumed NOT to be, unless rebutted. Where intention is absent, the agreement is unenforceable."],["Intention","Simkins v Pays [1955] concerned:",["A lottery/competition ticket holder who had to share winnings with regular contributors","A dishonoured cheque","A horse sale","A shop misprint"],0,"The court held the ticket holder had to share winnings with two others who had regularly contributed, on the slide's facts, a case on intention in social/group arrangements."],["Consideration","Which statement about consideration is TRUE?",["A bare promise is good consideration","It must be adequate","It must be real or sufficient, but need not be adequate","It is always required, even in a deed under seal"],2,"Consideration must have some value, however small, but courts won't weigh its adequacy unless fraud, misrepresentation, duress or undue influence is claimed. A deed under seal needs none."],["Consideration","Which is NOT a listed rule of consideration?",["Must move from the promisee","Must not be past","Must not be illegal","Must equal the market value"],3,"Rules: real/sufficient, need not be adequate, move from the promisee, not past, not illegal."],["Consideration","In Roscorla v Thomas (1842) the promise 'the horse is free from vice' was unenforceable because:",["It was oral","Past consideration is not valid","The horse was cheap","The seller was a minor"],1,"The sale was complete before the promise was made, so the buyer gave nothing in return for it: past consideration."],["Consideration","In the €30,000 kitchen example, the €3,000 settlement is an example of:",["Rescission","Accord and satisfaction","Rectification","Liquidated damages"],1,"Both parties give something up: the homeowner a discount and the right to sue, the contractor the right to claim €8,000. The new contract replaces the old."],["Consideration","What does the Pinnel rule state?",["Part payment of a debt is not acceptable satisfaction of the whole","Debts can be waived freely","Consideration must be adequate","Contracts need writing"],0,"A waiver needs consideration from the other side; otherwise the original right can be enforced. Equity may intervene via promissory estoppel (e.g. Kenny v Kelly 1988) where a party reasonably believed the right wouldn't be enforced."],["Form","Which contract MUST be in a particular form under statute?",["Sale of a bicycle","Sale of land","Hiring a taxi","Buying lunch"],1,"Statutory form is required for: contracts unsupported by consideration (deed), sale of land, bill of exchange, assignment of IP, transfer of shares and HP agreements."],["Form","Under the Statute of Frauds 1695, which needs a signed written memorandum?",["Promise to answer for another person's debt, land sales, agreements not performable within a year","All commercial contracts","Only loans","Only sales of goods"],0,"A memorandum need not be a single document; correspondence can suffice if it names the parties, identifies the property and price, and is signed (liberally interpreted, e.g. a letterhead)."],["Form","The 'part performance' doctrine exists because equity will not allow:",["Oral contracts at all","The Statute of Frauds to be used as an 'engine for fraud'","Deeds under seal","Minors to contract"],1,"Where no written document exists but part performance has taken place, equity intervenes."],["Terms","'A great little run around' vs '30k on the clock': which is which?",["First is a term, second a representation","First is a representation (inducement), second a term","Both terms","Both representations"],1,"Representations are not expressed terms and only induce; terms are meant to be legally binding."],["Terms","The parol evidence rule says:",["Oral evidence can never be heard","Oral evidence cannot generally be used to amend a written document","All terms must be oral","Writing is always void"],1,"Exceptions: where the document is confused and would cause injustice (e.g. 'all the oaks'), or where the writing is not the entire agreement (e.g. Clayton Love v B&I)."],["Terms","The contra proferentem rule means an ambiguous term is read:",["Against the party who imposed it","Against the weaker party","In favour of the stronger party","By ignoring it"],0,"It redresses the balance where a stronger party imposes standard terms on a weaker one."],["Terms","Dundalk Shopping Centre v Roof Spray Ltd is an example of:",["A term implied by law: reasonable care and skill","A void term","An exemption clause","A restraint of trade"],0,"Courts imply terms the parties would have included had they thought about it, or imply them as a matter of law due to the nature of the contract."],["Terms","Which Act is listed as a source of terms implied by law?",["Sale of Goods Acts 1893-1980","Statute of Frauds 1695","Infant Relief Act 1873","Competition Act 1991"],0,"Others listed: Unfair Terms in Consumer Contracts Regs 1995, Consumer Credit Act 1995, Minimum Notice and Terms of Employment Act 1973, Holiday (Employees) Act 1973."],["Terms","Classification: which term gives the innocent party the right to terminate AND claim damages for any breach?",["Warranty","Condition","Representation","Recital"],1,"A condition is the basis of the contract. Breach is 'repudiatory': terminate or affirm, and sue for damages either way. A warranty allows damages only."],["Terms","An innominate term:",["Is always a warranty","Is always a condition","Has its remedy decided by the court according to how serious the breach is","Cannot be breached"],2,"If the breach is substantial the term is treated like a condition (terminate + damages); if minor, like a warranty (damages only)."],["Exemption clauses","L'Estrange v Graucob (1934): she signed without reading. Held:",["Not bound, she didn't read it","Bound by signature regardless of reading","Bound only if clause was bold","Contract void"],1,"A party who signs is bound whether or not they read it."],["Exemption clauses","Thornton v Shoe Lane Parking (1971): why was the ticket clause ineffective?",["It was too long","Contract was formed when money went in the machine; the ticket terms came too late","Parking is illegal","He was a minor"],1,"Notice must be given before or at the time of contracting, not after. Ollie v Marlborough Hotel is another example."],["Exemption clauses","In Curtis v Chemical Cleaning (1951) the clause failed because:",["It was printed small","The customer had been misled about its scope","Dry cleaning is exempt","The dress was cheap"],1,"Mrs Curtis was told it covered only beads and sequins; she was misled into signing, so it did not bind her."],["Exemption clauses","Hollier v Rambler Motors (1972) rejected the garage's argument because:",["A few isolated past transactions were not a 'course of dealings'","He had signed","The garage was Irish","No clause existed"],0,"He had used the garage three or four times over years and no receipt was issued on the occasion in question."],["Exemption clauses","In Alexander v Irish National Stud, a clause excluding liability for 'accident' did not cover:",["Weather","The Stud's negligence","Theft","Fire"],1,"Negligence is outside the realm of 'accidents'. In Regan v Irish Automobile Club, 'however so caused' widened the clause to include negligence."],["Exemption clauses","Clayton Love v B&I (Irish Supreme Court) vs Photo Production v Securicor (English HL):",["Both said clauses may cover fundamental breach","Irish: no clause can cover breach of key obligations; English: may cover fundamental breach","Reverse of that","Neither involved exemption clauses"],1,"Scampi defrosted in transit, so the Irish court refused to let the clause excuse breach of the core obligation. In Securicor the clause was valid despite a fire started by an employee."],["Capacity","A minor in Irish contract law is someone:",["Under 21","Under 18 and not married","Under 16","Under 25"],1,"Minors' contracts are classified as binding, voidable or void."],["Capacity","A minor buying on credit is bound only if the contract is for:",["Luxuries","Necessaries","Anything under €100","Property"],1,"Necessaries support life or keep the minor in the comfort they are used to; luxuries do not count. Apprenticeship, education and advancement contracts also bind."],["Capacity","Keay v Great Southern Railway: what happened?",["A minor was bound","A child on a reduced-fare ticket with excluded liability could repudiate and sue after injury","The company won","A drunkard avoided a ticket"],1,"The contract was voidable by the minor because it was no longer beneficial; it cannot be avoided by the other party."],["Capacity","Under the Infant Relief Act 1873, which minors' contracts are VOID?",["Apprenticeships","Money lent and luxury goods","Necessaries","Education"],1,"Void contracts cannot be confirmed by minors or enforced against them, though minors may enforce them."],["Capacity","Government of Canada v EAT (1992) concerned:",["Sovereign immunity of an embassy employer","Duress","Restraint of trade","Mistake"],0,"The Supreme Court dismissed an embassy employee's unfair dismissal claim. Immunity won't apply where a diplomat makes a claim against a subject of the state."],["Invalid contracts","Match the effect: mistake, duress, undue influence, misrepresentation.",["Mistake void; the other three voidable","All void","All voidable","Mistake voidable; others void"],0,"Statute requirement not met = unenforceable; illegal = offends statute/common law."],["Invalid contracts","Cundy v Lindsay (1878): Blenkarn signed to look like 'Blenkiron & Co'. Result?",["Contract void: sellers could recover goods from the innocent third party","Contract valid, third party kept goods","Contract rectified","Sellers got damages only"],0,"Mistake as to identity: sellers intended to deal only with the known firm."],["Invalid contracts","Nolan v Graves & Hamilton (1946): the auctioneer wrote £4,500 not £5,500. The court:",["Enforced £4,500","Rectified to the higher price: the purchaser was taking advantage of a unilateral mistake","Voided the sale","Awarded damages"],1,"Unilateral mistake: one party errs and the other knows. Courts rectify or grant rescission."],["Invalid contracts","Which is a valid definition of misrepresentation?",["Opinion such as 'best deal in town'","A false statement of material fact that induces the other to contract and is relied on","Silence about a defect","A broken promise"],1,"Mere puffs and opinions don't count (unless from a professional). Caveat emptor means silence is generally fine, except uberrima fides contracts."],["Invalid contracts","Gahan v Boland: buyer asked if a motorway would affect the property; told 'no'. Remedy?",["Damages only","Rescission (innocent misrepresentation)","Nothing","Specific performance"],1,"The seller believed it to be true, so the misrepresentation was innocent, yet the Supreme Court ordered rescission."],["Invalid contracts","Fraudulent misrepresentation is a statement made:",["Honestly but carelessly","Knowing it is untrue, or recklessly as to its truth","With no reliance","Only in writing"],1,"Fenton v Schofield: false fishery claims and renovation claims led to damages."],["Invalid contracts","The Atlantic Baron (1979) is an example of:",["Mistake","Economic duress: the ferry company recovered the extra 10%","Undue influence","Illegality"],1,"Duress includes violence/threats to person or family and serious threats to property. A threat of legal action is generally NOT duress."],["Invalid contracts","To rebut a presumption of undue influence, the stronger party must show:",["The weaker party was rich","Full disclosure, adequate consideration, and independent advice","The contract was written","Time has passed"],1,"Fiduciary relationships (priest/confessor, doctor/patient, grandparent/grandchild) raise the presumption. In King v Anderson the sale was set aside even after 15 years."],["Invalid contracts","Grealish v Murphy involved:",["An unconscionable bargain exploiting a mentally deficient farmer","A wager","A misprinted price","A restraint clause"],0,"The farm settlement to a 32-year-old unrelated haulier was improvident; the burden of justification rests on the stronger party."],["Invalid contracts","'Ex turpi non oritur actio' means:",["From an evil cause no action arises","Let the buyer beware","Words of agreement","Necessary parties"],0,"Applied to contracts tainted by sexual immorality; also Ennis v Butterly (cohabitation 'palimony' claim unenforceable)."],["Invalid contracts","Nolan v Shiels (1926) shows illegality at common law because:",["A dishonoured cheque was given to prevent a prosecution","A bet was placed","A minor signed","A price was misprinted"],0,"Impeding the administration of justice is illegal. Common law also refuses wagering agreements and Revenue fraud (e.g. Lord v Woods)."],["Competition","In Masterfoods v HB Ice Cream (1993), HB was:",["Dominant but did NOT abuse dominance","Dominant and abused","Not dominant","Fined"],0,"HB had 70% of the impulse ice-cream market for decades. Requiring retailers to store only HB ice cream in HB's fridges was not an abuse."],["Restraint of trade","A restraint of trade clause is prima facie:",["Valid","Void, unless reasonable between the parties and consistent with public good","Voidable by employer","Criminal"],1,"It restricts a party from freely exercising a trade, calling or profession."],["Restraint of trade","Oates v Romano (1950): not to work within 1 mile of Dublin shop for 3 years. Held:",["Valid","Void: it prevented the assistant working in Dublin","Severed to 1 year","Enforced in part"],1,"In Skerry v Moles the court severed the unreasonable clauses (Dublin, Cork) and kept the rest. Restrictions combine activities, geography and time."],["Discharge","Cutter v Powell (1795): the sailor died before Liverpool. Why no pay?",["Contracts discharged by death are void","It was an entire contract needing complete performance for the lump sum","He signed no deed","Maritime law"],1,"Had pay been monthly, the contract would be divisible. Coughlan v Mooney is a similar entire-contract case."],["Discharge","Kincora Builders v Cronin (1973): why couldn't the builder use substantial performance?",["He finished","He knowingly refused to insulate the attic and so abandoned the contract","The client paid","It was oral"],1,"The doctrine is available only when parties genuinely dispute whether the standard was met."],["Discharge","Time limits under the Statute of Limitations 1957:",["Breach <6 years; recovery of land <12 years","Breach <2 years; land <6","Both 12 years","Both 6 years"],0,"Discharge by operation of law also includes merger of an oral contract into a later written one and death in personal service contracts."],["Discharge","Discharge by frustration requires:",["A breach by one party","Performance becoming impossible later, with neither party causing or foreseeing the event","Impossibility from the outset","Mutual agreement"],1,"If impossible from the outset it is void. McGuill v Aer Lingus: illegality can frustrate performance."],["Discharge","Anticipatory breach means one party:",["Performs early","Indicates before the time for performance that it won't perform, entitling damages from then","Substantially performs","Pays a deposit"],1,"A breach discharges the contract only if the innocent party treats it as repudiation."],["Remedies","Hadley v Baxendale (1854) limits damages to loss that was:",["Any loss at all","Reasonably in the contemplation of the parties at the time of contracting","Exactly the contract price","Punitive"],1,"Damages compensate and aim to put the party where they would have been had the contract been performed (McGrath v Kiely)."],["Remedies","Liquidated damages differ from a penalty because they are:",["A genuine pre-assessment of loss; penalties can't be enforced","Larger","Always nominal","Only for minors"],0,"Nominal damages: breach with no actual loss. Exemplary damages: greater than the pecuniary loss."],["Remedies","Which remedy is a discretionary order, generally refused where damages are adequate?",["Specific performance","Quantum meruit","Rescission","Rectification"],0,"An injunction orders a party to do or refrain from something, commonly in restraint of trade cases."],["Remedies","Rescission v rectification:",["Rescission sets the contract aside, returning parties to their pre-contract positions; rectification fixes recording defects","Same thing","Rectification sets aside; rescission fixes wording","Both give damages"],0,"Rescission is available for mistake, undue influence, fraudulent misrepresentation and unconscionable bargain; damages are not recoverable with it. Rectification covers defects in recording, not in contract making."],["Scenarios","Sean's chainsaw has a misprinted price of €20. Can he insist on the sale?",["Yes, it's false advertising","No: the display is an invitation to treat; the shop can refuse his offer","Yes, display = offer","Yes, if he pays €250"],1,"Displayed goods only seek offers from customers, so Sean's offer at the till can be refused."],["Scenarios","Sean's lost-phone advert (€50 reward) is a:",["Unilateral contract offer to the world (Carlill), which Glen accepted by returning the phone","Invitation to treat","Social agreement","Void contract"],0,"Glen can enforce the €50 reward, but not the €5,000 he demanded, since the offer was only €50. His age is irrelevant to receiving payment under an offer he accepted by performing."],["Scenarios","Sean advertises 'Looking for a chainsaw, will not pay more than €150'. Must he buy Joe's at €149?",["Yes","No: the ad is an invitation to treat, not an offer","Yes, it is an offer to the world","Only if Joe sues"],1,"It is an invitation to treat inviting offers. Joe's €149 is an offer that Sean may accept or decline."],["Scenarios","Liam owes ColdSpares €100,000 and settles for €40,000 plus 5 fridge freezers. Valid?",["No, Pinnel rule applies","Yes: the extra freezers are fresh consideration, an accord and satisfaction","No, ColdSpares was reluctant","Yes, without consideration"],1,"Part payment alone fails under Pinnel, but adding something different (the freezers) is consideration for the waiver."],["Scenarios","Eskimo Food gets a 25% price cut with no new benefit to Liam. Consideration?",["Yes, good faith","No: nothing is given in return; fix it by a deed or a small genuine benefit","Yes, they stay customers","Not needed"],1,"A waiver of rights needs consideration (or a deed). Promissory estoppel might also help in equity."],["Scenarios","Deirdre's plates: Szechuan adds new conditions (boxes, brackets, or €4,000) then 'accepts the original offer'. Result?",["Contract at €5,000","No contract: their variation was a counter-offer that killed the offer (Hyde v Wrench)","Contract at €4,000","Void for mistake"],1,"Her online ad was an invitation to treat anyway. Advise her she is free to sell to the other buyer."],["Scenarios","Frank/Robert: acceptance posted Thursday; phone withdrawal Friday; letter opened Monday. Advise Frank:",["Withdrawal effective, no contract","Postal rule: contract formed Thursday on posting, and the later phone message can't undo it","Offer lapsed on Sunday","Contract formed Monday"],1,"The deadline was Sunday and the acceptance was posted in time. Robert cannot unilaterally withdraw an accepted offer, so Frank can enforce the share sale."],["Agreement","An offer can be made to:",["Only a group of two or more","Only a named individual","An individual, a group or the whole world","Only a registered company"],2,"Offers can be made to an individual, a group or the whole world (Carlill v Carbolic Smoke Ball)."],["Agreement","'Ad idem' in contract formation means:",["Both parties are adults","The acceptance is in writing","The consideration is adequate","The parties agree on the essential points"],3,"Ad idem = of one mind: the parties agree on the essential points."],["Agreement","Which of these is an invitation to treat rather than an offer?",["A £100 reward advert like Carlill","A sign saying 'open for petrol'","An acceptance posted to the offeror","A signed deed"],1,"Adverts such as 'strawberries for sale' or 'open for petrol' only invite others to make an offer. Carlill is the exception: an offer to the whole world."],["Agreement","Which forms can a contract take, in general?",["Only oral","Only written or by deed","Written, oral or by conduct","Only written"],2,"No particular form is generally required. Only a limited number must be in writing, though a contract of value should be."],["Agreement","Freedom of contract is described as:",["A rule banning standard terms","The most important principle of contract law","A statutory duty to contract","A rule that applies only to consumers"],1,"Freedom of contract is the key principle; either statute or common law then applies."],["Acceptance","'Acceptance in principle' or merely acknowledging receipt of an offer is:",["A counter-offer","A revocation","Not acceptance","Valid acceptance"],2,"Acceptance must be clearly communicated. Acknowledging receipt or accepting 'in principle' does not count."],["Acceptance","Acceptance must:",["Be adequate in value","Be sent by post","Be in writing","Match the offer without varying its terms"],3,"Any variation of terms is a counter-offer, which kills the original offer (Hyde v Wrench)."],["Acceptance","Which is an exception to the rule that acceptance must be communicated to the offeror?",["Acceptance in principle","The postal rule","A counter-offer","Silence"],1,"The exceptions are the postal rule (not for instant communication) and unilateral contracts. Silence is never acceptance (Felthouse v Brindley)."],["Acceptance","Which is an example of acceptance by conduct?",["Staying silent","Acknowledging receipt of a quote","Scanning an item at a self-checkout","Making a counter-offer"],2,"Acceptance can be by conduct, such as handing an item to a shop assistant or scanning it."],["Acceptance","In 'battle of the forms' disputes, the notes say:",["The first form always wins","The bigger company's form always wins","The last form always wins","There are no set rules; courts look at all the correspondence"],3,"Butler Machine Tool v Ex-Cell-O: no set rules, and in complex disputes the courts look at all the correspondence."],["Offer termination","An offer can only be withdrawn (revoked):",["Only within 6 years","Before it is accepted","After it is accepted","Only with the offeree's consent"],1,"Withdrawal is possible only before acceptance. Revocation by post counts only on receipt."],["Offer termination","A rejection of an offer must be:",["Witnessed","In writing","Made by deed","Communicated"],3,"Rejection must be communicated. A counter-offer also counts as a rejection."],["Offer termination","How long does an offer stay open before it lapses?",["14 days","Exactly 1 year","A question of fact, depending on the circumstances","Exactly 6 months"],2,"Lapse through time has no fixed period; it is a question of fact (see Loring v City of Boston)."],["Offer termination","Can a party unilaterally add new terms after agreement is reached?",["Yes, at any time","Yes, within 6 years","No, unless the contract reserves that right or the other party accepts the new term","Yes, if done in writing"],2,"Terms can't be added unilaterally once agreement is reached, though the contract may include a right to add terms, and the other party can accept a new term."],["Intention","What is the presumption for social or domestic agreements?",["Always legally binding","Binding if over €1,000","Binding if in writing","Not intended to be legally binding, unless rebutted"],3,"Commercial agreements are presumed binding; social/domestic ones are presumed not binding. Either can be rebutted."],["Intention","If intention to be legally bound is absent, the agreement is:",["Unenforceable","Voidable","Binding for damages only","Valid"],0,"Without intention to be legally bound the agreement cannot be enforced."],["Intention","In Carlill, what showed the company's intention to be legally bound?",["£1,000 deposited in the bank to show sincerity","A deed under seal","The size of the advert","Mrs Carlill's signature"],0,"The bank deposit showed sincerity and intent to be legally bound."],["Consideration","Consideration is NOT needed where the contract is made:",["Online","By deed under seal","By phone","Between two businesses"],1 inate term is treated like:",["A warranty (damages only)","A void term","A condition","A representation"],0,"For innominate terms the court looks at the seriousness of the breach: serious = like a condition, minor = like a warranty."],["Exemption clauses","To rely on an exemption clause, the party must show:",["It was read aloud","It is in capital letters","It was incorporated and it covers the loss","It is under €100"],2,"Two requirements: incorporation into the contract, and that the clause covers the loss or damage suffered."],["Exemption clauses","Olley v Marlborough Court and Thornton v Shoe Lane Parking show that notice of a clause must be given:",["After the contract","Only orally","Before or at the time of contracting","Within 6 years"],2,"Notice that comes after the contract is formed is too late."],["Exemption clauses","Notice of an exemption clause on a receipt (e.g. a theatre ticket) is:",["Always effective","Effective if in bold","Generally not effective","Effective after a year"],2,"Not on receipts, but OK where the document is needed to get goods back (e.g. a dry-cleaning docket)."],["Exemption clauses","Regan v Irish Automobile Club: the words 'accident, however so caused' meant:",["The clause was narrowed","The clause was never incorporated","The clause was widened to cover negligence","The clause was void"],2,"Contrast Alexander v Irish National Stud: 'accident' alone did not cover negligence."],["Exemption clauses","For incorporation by notice, the party relying on it must show:",["Reasonable steps to give notice, not actual notice","A signed receipt","Actual notice to each customer","A solicitor's letter"],0,"Reasonable steps are enough; actual notice is not required."],["Capacity","A minor's contract paid for upfront is generally:",["Voidable by the adult","Void","Illegal","Binding, with the same rights as an adult"],3,"Paid upfront: same rights as adults. On credit: only necessaries bind."],["Capacity","Who can avoid a voidable contract made by an't enforce even a reasonable clause."],["Restraint of trade","A hairdresser's contract bars her from working anywhere in Ireland for 10 years. Likely result?",["A criminal offence","Valid because it's in writing","Valid because she signed","Unreasonable, so void or severed"],3,"Restraint clauses are prima facie void unless reasonable between the parties and consistent with the public good."],["Discharge","Coughlan v Mooney (1905): the builder didn't finish on time and another finished the job. Result?",["Specific performance ordered","Claim succeeded in full","Claim dismissed: an entire contract requires full performance","Rescission ordered"],2,"An entire contract requires complete, exact performance."],["Discharge","In a divisible contract:",["Completed parts can be paid for","Only full performance is paid","The contract is void","Only a deed can end it"],0,"Cutter v Powell: had the sailor been paid monthly, his wife would have been paid."],["Discharge","Substantial performance is a doctrine of:",["Statute","EU law","Equity, softening harsh results","Brehon law"],2,"Performance as complete as a reasonable person would expect; applies only where the party genuinely disputes the standard."],["Discharge","Tender of performance: if a genuine attempt to perform is refused:",["The contract is void","The contract continues unchanged","Damages are impossible","The contract is discharged"],3,"A refused tender that is an attempt to perform discharges the contract."],["Discharge","Discharge by agreement of an executed contract needs:",["An oral statement only","Consideration or a deed","Revenue approval","Nothing more"],1,"Executory: simple waiver. Executed: consideration or a deed, or a new contract on the same subject."],["Discharge","McGuill v Aer Lingus (1983) is associated with:",["Duress","Frustration","Rectification","Capacity"],1,"Possible at first, later impossible, and neither party caused or knew of the event."],["Discharge","A contract that was impossible from const KEY='moot.v1';
const SUBJ={law:'Sources of Law',eth:'Ethics',con:'Contract Law'};
const ALL=D.flatMap(s=>s.q.map((x,i)=>({id:s.k+i,s:s.k,t:x[0],q:x[1],o:x[2],a:x[3],e:x[4]})));
const BY=Object.fromEntries(ALL.map(q=>[q.id,q]));
const $=s=>document.querySelector(s),app=$('#app'),hdr=$('#top');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const when=t=>new Date(t).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.sessions))return{sessions:v.sessions,q:v.q||{},len:v.len==null?20:v.len}}catch(e){}return{sessions:[],q:{},len:20}}
let db=load(),view='home',S=null,armed=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

/* unseen questions first, then ones you missed last time, then the rest; always shuffled across all three subjects */
function pick(n){const b=[[],[],[]];shuf(ALL).forEach(q=>{const r=db.q[q.id];b[!r?0:r.l?2:1].push(q)});const all=b.flat();return shuf(n?all.slice(0,n):all)}

function bar(){hdr.innerHTML=`<button class="logo" data-act="home"><span class="dots"><i data-s="law"></i><i data-s="eth"></i><i data-s="con"></i></span>Bukie</button><nav aria-label="Main"><button data-act="home"${view==='home'?' aria-current="page"':''}>Practice</button><button data-act="hist"${view==='hist'?' aria-current="page"':''}>History</button></nav>`}

function home(){
  const g=Object.keys(SUBJ).map(k=>{const qs=ALL.filter(q=>q.s===k);return{k,qs,right:qs.filter(q=>(db.q[q.id]||{}).l===1).length}});
  app.innerHTML=`<h1 class="hero">Practice for the test.</h1>
<p class="lede">${ALL.length} questions from Sources of Law, Ethics and Contract Law, shuffled into one deck. Take as long as you like, there is no timer.</p>
<div class="start"><div class="seg" role="group" aria-label="Questions per session">${[10,20,40,0].map(n=>`<button data-act="len" data-n="${n}" aria-pressed="${db.len===n}">${n||'All'}</button>`).join('')}</div><button class="cta" data-act="start">Start practice</button></div>
<section class="map"><h2>Question map</h2><p class="key">Every square is a question. Solid means you got it right last time, red means you missed it, faint means you haven't seen it yet.</p>
${g.map(x=>`<div class="grp" data-s="${x.k}"><div class="gh"><span class="subj">${SUBJ[x.k]}</span><span class="mut">${x.right} of ${x.qs.length} right</span></div><div class="tiles">${x.qs.map(q=>{const r=db.q[q.id];return`<i class="${r?(r.l?'r':'w'):''}" title="${esc(q.q)}"></i>`}).join('')}</div></div>`).join('')}</section>`;
}

function begin(list){if(!list.length)return;S={qs:list,i:0,right:0,done:false,res:list.map(()=>null),miss:[],p:{},o:[]};view='quiz';quiz()}

function quiz(){
  const q=S.qs[S.i],n=S.qs.length;
  S.o=shuf(q.o.map((t,k)=>({t,ok:k===q.a})));S.done=false;
  hdr.innerHTML=`<button class="quiet" data-act="end">End session</button><span class="count">${S.i+1} of ${n}</span>`;
  app.innerHTML=`<div class="ribbon" aria-hidden="true" style="gap:${n>60?1:3}px">${S.qs.map((x,k)=>`<i data-s="${x.s}" class="${S.res[k]==='bad'?'bad on':S.res[k]?'on':k===S.i?'now on':''}"></i>`).join('')}</div>
<div class="meta"><span class="subj" data-s="${q.s}">${SUBJ[q.s]}</span><span>${esc(q.t)}</span></div>
<h2 class="q">${esc(q.q)}</h2>
<div class="opts">${S.o.map((o,k)=>`<button class="opt" data-act="pick" data-n="${k}"><span class="k">${'ABCDEF'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
<div id="fb" aria-live="polite"></div>`;
  window.scrollTo(0,0);
}

function choose(n){
  if(!S||S.done||!S.o[n])return;
  S.done=true;
  const q=S.qs[S.i],ok=S.o[n].ok;
  S.res[S.i]=ok?'ok':'bad';
  if(ok)S.right++;else S.miss.push(q.id);
  const p=S.p[q.s]||(S.p[q.s]=[0,0]);p[1]++;if(ok)p[0]++;
  const r=db.q[q.id]||(db.q[q.id]={s:0,w:0});r.s++;r.l=ok?1:0;if(!ok)r.w++;
  save();
  document.querySelectorAll('.opt').forEach((b,m)=>{
    b.disabled=true;
    if(S.o[m].ok){b.classList.add('ok');b.querySelector('.k').textContent='\u2713'}
    else if(m===n){b.classList.add('no');b.querySelector('.k').textContent='\u2715'}
    else b.classList.add('dim');
  });
  document.querySelectorAll('.ribbon i')[S.i].className=ok?'on':'bad on';
  $('#fb').innerHTML=`<div class="ruling" data-s="${q.s}"><b class="${ok?'g':'r'}">${ok?'Correct':'Not quite'}</b><p>${esc(q.e)}</p></div><div class="actions"><button class="cta" data-act="next">${S.i+1<S.qs.length?'Next question':'See results'}</button></div>`;
  $('#fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}

function finish(){
  const n=S.res.filter(Boolean).length;
  if(n){db.sessions.unshift({t:Date.now(),n,r:S.right,p:S.p,m:S.miss});db.sessions=db.sessions.slice(0,100);save()}
  view=n?'results':'home';render();
}

const missed=ids=>ids.filter(id=>BY[id]).map(id=>{const q=BY[id];return`<article class="miss" data-s="${q.s}"><span class="subj">${SUBJ[q.s]}</span><h3>${esc(q.q)}</h3><p class="ans">${esc(q.o[q.a])}</p><p class="why">${esc(q.e)}</p></article>`}).join('');

function results(){
  const n=S.res.filter(Boolean).length,p=Math.round(S.right/n*100);
  const msg=!S.miss.length?'No misses. Run another round to keep it fresh.':p>=80?'Strong round. The questions you missed are below.':p>=60?'Solid. Go through what you missed below.':'Keep going. Each missed question below comes with its explanation.';
  app.innerHTML=`<h1 class="hero sm">You got ${S.right} of ${n}.</h1><p class="lede">${p}%. ${msg}</p>
<div class="rows">${Object.keys(SUBJ).filter(k=>S.p[k]).map(k=>`<div class="prow" data-s="${k}"><span class="subj">${SUBJ[k]}</span><span class="fr">${S.p[k][0]} of ${S.p[k][1]}</span><div class="track"><i style="width:${S.p[k][0]/S.p[k][1]*100}%"></i></div></div>`).join('')}</div>
<div class="start" style="margin:12px 0 34px"><button class="cta" data-act="again">Practice again</button>${S.miss.length?`<button class="ghost" data-act="retry">Retry ${S.miss.length} missed</button>`:''}</div>
${S.miss.length?`<h2 class="sec">Missed</h2>${missed(S.miss)}`:''}`;
}

function hist(){
  const ss=db.sessions;
  if(!ss.length){app.innerHTML=`<h1 class="hero sm">History</h1><p class="lede">Nothing here yet. Finish a practice session and it will appear here with your score and the questions you missed.</p><div class="start"><button class="cta" data-act="home">Start practising</button></div>`;return}
  const pc=s=>Math.round(s.r/s.n*100);
  const avg=Math.round(ss.reduce((a,s)=>a+pc(s),0)/ss.length),best=Math.max(...ss.map(pc));
  app.innerHTML=`<h1 class="hero sm">History</h1>
<p class="sum"><b>${ss.length}</b> ${ss.length===1?'session':'sessions'}, <b>${avg}%</b> average, best <b>${best}%</b>.</p>
<div class="trend" role="img" aria-label="Scores of your most recent sessions, oldest to newest">${ss.slice(0,24).reverse().map(s=>`<i title="${when(s.t)}: ${pc(s)}%"><b style="height:${Math.max(pc(s),3)}%"></b></i>`).join('')}</div>
<div>${ss.map(s=>`<details class="sess"><summary><span class="when">${when(s.t)}</span><span class="mix">${Object.keys(SUBJ).filter(k=>s.p[k]).map(k=>`<span class="mb" data-s="${k}" title="${SUBJ[k]}: ${s.p[k][0]} of ${s.p[k][1]}"><i style="width:${s.p[k][0]/s.p[k][1]*100}%"></i></span>`).join('')}</span><span class="sc"><b>${s.r}/${s.n}</b> ${pc(s)}%</span></summary><div class="sbody">${s.m.length?`<button class="ghost" data-act="redo" data-ids="${s.m.join(',')}">Practise these ${s.m.length} again</button>${missed(s.m)}`:'<p class="mut">No misses in this session.</p>'}</div></details>`).join('')}</div>
<button class="quiet danger" data-act="clear">Clear history and progress</button>`;
}

function render(){window.scrollTo(0,0);if(view==='quiz')return quiz();bar();({home,hist,results})[view]()}

function act(a,b){
  if(a==='home'){view='home';render()}
  else if(a==='hist'){view='hist';render()}
  else if(a==='len'){db.len=+b.dataset.n;save();document.querySelectorAll('[data-act=len]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
  else if(a==='start'||a==='again')begin(pick(db.len));
  else if(a==='pick')choose(+b.dataset.n);
  else if(a==='next'){S.i++;S.i<S.qs.length?quiz():finish()}
  else if(a==='end')finish();
  else if(a==='retry')begin(shuf(S.miss.map(id=>BY[id])));
  else if(a==='redo')begin(shuf(b.dataset.ids.split(',').filter(id=>BY[id]).map(id=>BY[id])));
  else if(a==='clear'){
    if(!armed){armed=1;b.textContent='Tap again to erase all history and progress';setTimeout(()=>{armed=0;if(b.isConnected)b.textContent='Clear history and progress'},4000)}
    else{armed=0;db={sessions:[],q:{},len:db.len};save();render()}
  }
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!S||e.metaKey||e.ctrlKey||e.altKey)return;
  if(!S.done){if(e.key.length===1){const i='1234'.indexOf(e.key),j='abcd'.indexOf(e.key.toLowerCase()),k=i>-1?i:j;if(k>-1)choose(k)}}
  else if(e.key==='Enter'){e.preventDefault();act('next')}
});

render();
})();
</script>
</body>
</html>
